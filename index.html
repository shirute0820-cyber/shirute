<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>偉人カードゲーム</title>
<style>
  :root{
    --felt-1: #16241f; --felt-2: #1f342c;
    --card-face: #f6f1e4; --ink: #241c14; --ink-soft: #5a4f40;
    --brass: #c9a227; --seat-a: #c9852f; --seat-b: #3f7d78; --danger: #8a3a2c;
    --line: rgba(246,241,228,0.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,0.05), transparent 60%),
                linear-gradient(160deg, var(--felt-1), var(--felt-2) 70%);
    color: var(--card-face);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    display:flex; flex-direction:column; align-items:center; padding: 28px 14px 60px;
  }
  /* bodyのflexアイテムであるため、内部に横長コンテンツ(ゾーン盤面など)があっても
     縮まずページ全体が横に広がってしまう。min-width:0で明示的に縮小を許可する。 */
  #app{ width:100%; min-width:0; }
  .display{ font-family: Georgia, "Iowan Old Style", "Hiragino Mincho ProN", serif; }
  .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:0.03em; }

  .stub{
    position:relative; display:inline-flex; align-items:center; gap:14px;
    background: var(--card-face); color: var(--ink); padding: 10px 22px; border-radius: 3px;
    border: 1.5px dashed rgba(36,28,20,0.35); margin-bottom: 22px;
  }
  .stub::before, .stub::after{ content:""; position:absolute; width:14px; height:14px; background: var(--felt-2); border-radius:50%; top:50%; transform:translateY(-50%); }
  .stub::before{ left:-7px; } .stub::after{ right:-7px; }
  .stub .code{ font-size:22px; font-weight:700; letter-spacing:0.12em; }
  .stub .seat-tag{ font-size:12px; padding:3px 8px; border-radius:2px; color:#fff; }
  .seat-tag.A{ background:var(--seat-a); } .seat-tag.B{ background:var(--seat-b); }

  h1.title{ font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  p.sub{ opacity:0.65; margin:0 0 26px; font-size:14px; }

  .panel{ width:100%; max-width: 640px; background: rgba(0,0,0,0.18); border: 1px solid var(--line); border-radius: 10px; padding: 26px; }
  .field-row{ margin-bottom:16px; }
  .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .grid3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; }
  label.small-label{ display:block; font-size:12px; opacity:0.7; margin-bottom:6px; letter-spacing:0.04em; }
  input[type=text], input[type=number], textarea, select{
    width:100%; background: rgba(246,241,228,0.06); border: 1px solid var(--line);
    border-radius: 6px; color: var(--card-face); padding: 9px 11px; font-size: 14.5px; font-family: inherit;
  }
  textarea{ min-height: 140px; resize: vertical; line-height:1.7; }
  input::placeholder, textarea::placeholder{ color: rgba(246,241,228,0.35); }

  .seat-picker{ display:flex; gap:12px; }
  .seat-btn{ flex:1; padding:16px; border-radius:8px; cursor:pointer; border:1.5px solid var(--line); background: rgba(246,241,228,0.04); text-align:center; font-size:15px; transition: all .15s ease; }
  .seat-btn.selA.active{ border-color: var(--seat-a); background: rgba(201,133,47,0.18); }
  .seat-btn.selB.active{ border-color: var(--seat-b); background: rgba(63,125,120,0.18); }
  .seat-btn .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .seat-btn.selA .dot{ background: var(--seat-a); } .seat-btn.selB .dot{ background: var(--seat-b); }

  button.primary{ background: var(--brass); color: #241c14; border:none; border-radius:7px; padding: 12px 20px; font-size:15px; font-weight:700; cursor:pointer; }
  button.primary:disabled{ opacity:0.35; cursor:not-allowed; }
  button.ghost{ background: transparent; color: var(--card-face); border:1px solid var(--line); border-radius:7px; padding:10px 16px; font-size:14px; cursor:pointer; }
  button.linklike{ background:none; border:none; color:var(--brass); font-size:13.5px; cursor:pointer; text-decoration:underline; padding:4px 0; }
  button.small-add{ background: rgba(201,162,39,0.18); color: var(--brass); border:1px solid rgba(201,162,39,0.5); border-radius:7px; padding:10px 16px; font-size:14px; cursor:pointer; font-weight:700; }
  .full{ width:100%; }
  .row{ display:flex; gap:10px; } .between{ justify-content:space-between; align-items:center; }
  .hint{ font-size:12.5px; opacity:0.6; line-height:1.6; margin-top:8px; }
  .rules-list{ margin:0 0 18px; padding-left:20px; font-size:13.5px; line-height:1.8; }
  .rules-list li{ margin-bottom:6px; }
  .rules-list .rules-list{ margin:6px 0 0; font-size:13px; opacity:0.85; }
  .tabbar{ display:flex; gap:6px; margin-bottom:16px; }
  .tabbtn{ flex:1; text-align:center; padding:9px; border-radius:6px; cursor:pointer; font-size:13px; border:1px solid var(--line); opacity:0.6; }
  .tabbtn.active{ opacity:1; background: rgba(201,162,39,0.14); border-color: var(--brass); }

  .built-list{ margin-top:14px; }
  .built-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; background: rgba(246,241,228,0.04); margin-bottom:6px; font-size:13px; }
  .built-row .swatch{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .built-row .grow{ flex:1; }
  .built-row .del{ color:#e2a08a; cursor:pointer; font-size:12px; }
  .built-row .edit-link{ color: var(--brass); cursor:pointer; font-size:12px; }
  .built-row.editing{ border:1px solid var(--brass); background: rgba(201,162,39,0.12); }
  .count-badge{ font-size:12px; opacity:0.6; }

  .preset-row{ display:flex; align-items:center; gap:12px; padding:14px; border-radius:8px; background: rgba(246,241,228,0.04); border:1.5px solid var(--line); margin-bottom:10px; cursor:pointer; transition: all .12s ease; }
  .preset-row:hover{ border-color: rgba(201,162,39,0.4); }
  .preset-row.active{ border-color: var(--brass); background: rgba(201,162,39,0.12); }
  .preset-row .pname{ font-weight:700; font-size:15px; }
  .preset-row .pmeta{ font-size:12px; opacity:0.6; margin-top:2px; }
  .preset-row .pbuttons{ display:flex; gap:8px; margin-left:auto; }
  .preset-row .pbuttons button{ font-size:12px; padding:6px 10px; }
  .preview-box{ margin-top:16px; padding:16px; border-radius:8px; background: rgba(0,0,0,0.2); border:1px solid var(--line); }
  .preview-cardline{ font-size:12.5px; padding:4px 0; border-bottom:1px dashed var(--line); display:flex; gap:8px; align-items:center; }
  .preview-cardline .swatch{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  .status-line{ display:flex; align-items:center; gap:10px; padding:10px 0; }
  .pip{ width:10px; height:10px; border-radius:50%; background:#555; }
  .pip.ready{ background:#7fbf6b; }
  .conn-badge{ font-size:11px; padding:4px 10px; border-radius:20px; display:inline-flex; align-items:center; gap:6px; }
  .conn-badge.ok{ background: rgba(127,191,107,0.15); color:#9fd98c; }
  .conn-badge.bad{ background: rgba(138,58,44,0.25); color:#e2a08a; }
  .turn-banner{
    display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    padding:10px 16px; border-radius:8px; margin-bottom:14px;
    background: rgba(246,241,228,0.06); border:1px solid var(--line); font-size:13px;
  }
  .turn-banner.mine{ border-color: var(--brass); background: rgba(201,162,39,0.12); }
  .turn-whose{ font-weight:700; }

  .board{ width:100%; max-width: 980px; min-width:0; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; flex-wrap:wrap; gap:10px; }
  .zone{ border-radius:10px; padding: 14px 16px; margin-bottom:12px; border:1px solid var(--line); background: rgba(0,0,0,0.15); }

  .info-row{ display:flex; flex-wrap:wrap; gap:20px; align-items:flex-start; }
  .info-col{ display:flex; flex-direction:column; gap:6px; min-width:120px; }
  .hp-box{ display:flex; align-items:center; gap:6px; font-size:12.5px; }
  .hp-label{ opacity:0.6; font-size:11px; }
  .hp-pips{ display:flex; gap:3px; }
  .hp-pip{ width:12px; height:12px; border-radius:50%; border:1.5px solid rgba(246,241,228,0.4); }
  .hp-pip.filled{ background: var(--danger); border-color: var(--danger); }
  .hp-commander-note{ font-size:10.5px; color: var(--brass); font-weight:700; }

  /* PC(横幅900px以上)では上下の余白を詰めて、敵味方の場を同時に見やすくする */
  @media (min-width: 900px){
    .zone{ padding: 10px 16px; margin-bottom:8px; }
    .zone-board{ gap: 4px 10px; padding: 2px 2px 4px; }
    body{ padding-top:16px; }
  }
  .zone.mine{ border-color: rgba(201,133,47,0.4); }
  .zone-label{ font-size:11px; letter-spacing:0.08em; opacity:0.6; text-transform:uppercase; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  .cards-row{ display:flex; flex-wrap:wrap; gap:10px; min-height: 96px; }

  .zone-board-wrap{ overflow-x:auto; padding-bottom:4px; }
  .zone-board{ display:grid; grid-template-columns: repeat(5, 132px); grid-template-rows: auto 26px auto; gap: 6px 10px; padding: 4px 2px 8px; min-width: 700px; }
  .zone-connectors{ position:relative; width:100%; height:100%; pointer-events:none; }
  .zone-connector-line{ position:absolute; top:0; height:100%; overflow:visible; }
  .zone-connector-line line{ stroke: var(--brass); stroke-width:2.5; stroke-dasharray:5 4; opacity:0.55; }
  .zone-slot{ display:flex; flex-direction:column; align-items:center; gap:6px; position:relative; }
  .zone-slot-label{ font-size:10px; opacity:0.55; letter-spacing:0.05em; text-align:center; }
  .zone-empty{ width:128px; min-height:76px; border:1.5px dashed var(--line); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:11px; opacity:0.35; }
  .card.draggable{ cursor:grab; }
  .card.draggable:active{ cursor:grabbing; }
  .zone-slot.zone-drag-over .zone-empty{ border-color: var(--brass); opacity:0.8; background: rgba(201,162,39,0.1); }
  .zone-slot.zone-drag-over{ outline: 2px dashed var(--brass); outline-offset:3px; border-radius:8px; }
  .cards-row.zone-drag-over{ outline: 2px dashed var(--brass); outline-offset:3px; border-radius:8px; }

  .zone-picker{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; }
  .zone-pick-btn{
    flex: 1 1 120px; min-width:110px; padding:12px 10px; border-radius:8px; cursor:pointer;
    border:1.5px solid var(--line); background: rgba(246,241,228,0.06); color: var(--card-face);
    font-size:13.5px; display:flex; flex-direction:column; gap:4px; align-items:center;
  }
  .zone-pick-btn:not(:disabled):hover{ border-color: var(--brass); background: rgba(201,162,39,0.12); }
  .zone-pick-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .zone-pick-sub{ font-size:11px; opacity:0.65; }

  .zone-pick-cell{
    width:78px; min-height:54px; border-radius:6px; cursor:pointer;
    border:1.5px dashed var(--line); background: rgba(246,241,228,0.06); color: var(--card-face);
    font-size:10.5px; line-height:1.3; display:flex; align-items:center; justify-content:center; text-align:center; padding:4px;
  }
  .zone-pick-cell:not(:disabled):hover{ border-color: var(--brass); border-style:solid; background: rgba(201,162,39,0.14); }
  .zone-pick-cell:disabled{ opacity:0.4; cursor:not-allowed; }

  .commander-card{ display:inline-flex; flex-direction:column; gap:2px; min-width:180px; background: linear-gradient(135deg, #2a2116, #1c1710); color: var(--card-face); border: 1px solid rgba(201,162,39,0.5); border-radius:8px; padding:10px 12px; cursor:pointer; }
  .commander-card .ctag{ font-size:10px; color:var(--brass); letter-spacing:0.08em; }
  .commander-card .cname{ font-weight:700; font-size:14.5px; }
  .commander-card .caff{ font-size:11.5px; opacity:0.7; }

  .card{ width: 128px; min-height: 108px; background: var(--card-face); color: var(--ink); border-radius: 7px; padding: 8px 9px; box-shadow: 0 2px 5px rgba(0,0,0,0.35); cursor:pointer; font-size:11.5px; line-height:1.3; display:flex; flex-direction:column; gap:3px; border: 1px solid rgba(0,0,0,0.08); transition: transform .1s ease; }
  .card:hover{ transform: translateY(-3px); }
  .card.mulligan-selected{ outline: 3px solid var(--danger); outline-offset:2px; opacity:0.55; cursor:pointer; }
  .mulligan-tag{ margin-top:4px; font-size:10px; font-weight:700; color: var(--danger); text-align:center; }
  .card .toprow{ display:flex; justify-content:space-between; align-items:center; }
  .card .swatch{ width:9px; height:9px; border-radius:50%; }
  .card .status{ font-weight:700; font-size:12.5px; }
  .card .status.sein{ color: var(--danger); }
  .card .cname{ font-weight:700; font-size:12.5px; margin-top:1px; }
  .caff-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .card .caff{ color: var(--ink-soft); font-size:10.5px; }
  .effect-icon{
    flex-shrink:0; font-size:9px; font-weight:700; color: var(--ink-soft);
    border:1px solid rgba(0,0,0,0.25); border-radius:9px; padding:1px 6px; cursor:help;
    background: rgba(0,0,0,0.05);
  }
  .card-tooltip{
    display:none; position:fixed; z-index:200; max-width:220px;
    background:#1c1710; color:#f6f1e4; padding:9px 11px; border-radius:7px;
    font-size:11.5px; line-height:1.6; white-space:pre-line;
    box-shadow:0 6px 16px rgba(0,0,0,0.45); pointer-events:none;
  }
  .counter-row{ display:flex; align-items:center; gap:5px; font-size:10.5px; margin-top:3px; padding-top:3px; border-top:1px dashed rgba(0,0,0,0.12); color: var(--ink); font-weight:600; }
  .counter-row button{ width:17px; height:17px; line-height:15px; padding:0; font-size:12px; border-radius:3px; border:1px solid rgba(0,0,0,0.2); background:#efe9da; cursor:pointer; }
  .counter-row button:hover{ background:#e2d9c2; }
  .status.adj{ color: #1d6e5c; }
  .stat-adjust-row{ display:flex; align-items:center; gap:4px; margin-top:3px; padding-top:3px; border-top:1px dashed rgba(0,0,0,0.12); flex-wrap:wrap; }
  .stat-adjust-row button{ font-size:9.5px; padding:2px 5px; border-radius:3px; border:1px solid rgba(0,0,0,0.2); background:#efe9da; color:var(--ink); cursor:pointer; }
  .stat-adjust-row button:hover{ background:#e2d9c2; }
  .stat-adjust-row button.reset{ background: rgba(29,110,92,0.15); border-color:#1d6e5c; color:#1d6e5c; font-weight:700; }
  .card.back{
    width: 52px; min-width:52px; height: 74px; min-height:0; padding:0;
    background: repeating-linear-gradient(45deg, var(--seat-b), var(--seat-b) 6px, #2e5f5a 6px, #2e5f5a 12px);
    cursor:default;
  }
  .card.back.A{ background: repeating-linear-gradient(45deg, var(--seat-a), var(--seat-a) 6px, #a56e26 6px, #a56e26 12px); }

  .deckbox{ display:flex; align-items:center; gap:14px; }
  .deck-stack{ position:relative; width:64px; height:82px; flex-shrink:0; }
  .deck-stack .card.back{ position:absolute; top:6px; left:0; }
  .deck-stack .card.back:nth-child(2){ top:3px; left:4px; }
  .deck-stack .card.back:nth-child(3){ top:0; left:8px; }
  .deckbox .num{ font-size:26px; font-weight:700; }
  .deckbox .lbl{ font-size:11px; opacity:0.6; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  button.act{ background: rgba(246,241,228,0.08); color: var(--card-face); border:1px solid var(--line); border-radius:6px; padding:8px 12px; font-size:13px; cursor:pointer; }
  button.act:hover{ background: rgba(246,241,228,0.16); }
  button.act:disabled{ opacity:0.3; cursor:not-allowed; }
  button.act.toggled{ background: rgba(138,58,44,0.35); border-color: var(--danger); }

  .log-panel{ max-height: 150px; overflow-y:auto; font-size:12.5px; opacity:0.75; border-top: 1px solid var(--line); margin-top: 14px; padding-top:10px; }
  .log-entry{ margin-bottom:4px; }

  .overlay{ position:fixed; inset:0; background: rgba(10,15,13,0.72); display:flex; align-items:center; justify-content:center; z-index:50; padding: 20px; }
  .modal{ background: var(--felt-2); border:1px solid var(--line); border-radius:12px; padding: 22px; width:100%; max-width: 560px; max-height:80vh; overflow-y:auto; }
  .modal h3{ margin-top:0; font-size:16px; }
  .modal-cards{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; }
  .waiting-overlay{ position:fixed; inset:0; background: rgba(10,15,13,0.55); display:flex; align-items:center; justify-content:center; z-index:40; font-size:15px; text-align:center; padding:20px; }
  .waiting-overlay .box{ background: var(--felt-2); border:1px solid var(--line); border-radius:10px; padding:24px 30px; }
  .empty-note{ opacity:0.45; font-size:12.5px; padding: 6px 2px; }
  .modal-detail-row{ font-size:13.5px; margin-bottom:6px; opacity:0.9; }
  .setup-warning{ max-width:640px; background: rgba(138,58,44,0.18); border:1px solid var(--danger); border-radius:10px; padding:22px; line-height:1.8; font-size:14px; }
  .setup-warning code{ background: rgba(0,0,0,0.3); padding:2px 6px; border-radius:4px; }
</style>
</head>

<script type="module">
/* =====================================================================
   Firebase 設定
   ここに、あなたが作成した Firebase プロジェクトの設定値を貼り付けてください。
   Firebaseコンソール → プロジェクトの設定 → 全般 → マイアプリ → SDK の設定と構成 で
   表示される firebaseConfig をそのままコピーして置き換えます。
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyB_XKunxOWnvdJQ5fDntc0Ioud_-KLVOfM",
  authDomain: "card-table-315ab.firebaseapp.com",
  databaseURL: "https://card-table-315ab-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "card-table-315ab",
  storageBucket: "card-table-315ab.firebasestorage.app",
  messagingSenderId: "714968976301",
  appId: "1:714968976301:web:a9e1b1c30ff2fe726aaf24"
};
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getDatabase, ref, set, get, remove, onValue
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const app = document.getElementById("app");
const NOT_CONFIGURED = firebaseConfig.apiKey === "YOUR_API_KEY";

if (NOT_CONFIGURED) {
  app.innerHTML = `
    <h1 class="title display">偉人カードゲーム</h1>
    <div class="setup-warning">
      <b>まだセットアップが完了していません。</b><br><br>
      このファイルの先頭付近にある <code>firebaseConfig</code> を、あなた自身の Firebase プロジェクトの設定値に書き換えてから、もう一度このページを開いてください。<br><br>
      手順が分からない場合は、このファイルを作成した会話に戻って「Firebaseの設定方法を教えて」と聞いてください。
    </div>
  `;
} else {
  runApp();
}

function runApp(){
  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);

  let roomCode = "";
  let mySeat = null;
  let isSpectator = false;
  let screen = "home";
  let rulesReturnTo = "home";
  let state = { A: null, B: null };
  let connStatus = { A: false, B: false };
  let unsubA = null, unsubB = null, unsubShared = null, unsubDecks = null;
  let sharedState = { turnState: "normal", currentTurn: null, turnNumber: 0, gameInitialized: false, dealt: false, firstPlayer: null, ended: false };
  let gameInitInProgress = false;
  let dragData = null;
  let modal = null;
  let selectedSeatChoice = "A";
  let roomCodeDraft = "";
  let errorMsg = "";
  let deckTab = "form";

  let presetList = [];
  let deckSetupPresets = [];
  let selectedPresetId = null;
  let selectedPresetDetail = null;
  let editingPresetId = null;
  let presetManagerReturnTo = "home";
  let presetEditorReturnTo = "presetManager";

  let previewPresets = [];
  let selectedPreviewId = null;
  let selectedPreviewDetail = null;

  function freshDraft(){
    return {
      deckName: "",
      commander: { affiliation:"", name:"", effect:"" },
      stackLabel: "",
      cards: [],
      formCard: { color:"", name:"", affiliation:"", status:"", seinenba:"", effect1:"", effect2:"", counterLabel:"", qty:"1" },
      bulkText: ""
    };
  }
  let draft = freshDraft();

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function showEffectTip(e){
    const el = e.currentTarget;
    const text = el.getAttribute("data-effect") || "";
    const tip = document.getElementById("cardTooltip");
    if(!tip) return;
    tip.textContent = text;
    tip.style.display = "block";
    const rect = el.getBoundingClientRect();
    const tipRect = tip.getBoundingClientRect();
    let top = rect.top - tipRect.height - 8;
    if(top < 8) top = rect.bottom + 8;
    let left = rect.left + rect.width/2 - tipRect.width/2;
    left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8));
    tip.style.top = top + "px";
    tip.style.left = left + "px";
  }

  function uid(){ return Math.random().toString(36).slice(2,10); }

  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function fmtMod(n){ return (n >= 0 ? "+" : "") + n; }

  const COLOR_MAP = {

    "白":"#e8e2d0", "紫":"#6b3fa0", "橙":"#d17a22", "無":"#8a8a8a"

  // 場のゾーン定義。メイン①はサブ①・サブ②に、メイン②はサブ②・サブ③に接続。
  // row1にメイン、row3にサブを互い違いに配置し、row2に接続線を描画してM字型を視覚的に表現する。
  const ZONE_DEFS = [
    { key: "sub1",  label: "サブゾーン①",  row: 3, col: 1 },
    { key: "main1", label: "メインゾーン①", row: 1, col: 2 },
    { key: "sub2",  label: "サブゾーン②",  row: 3, col: 3 },
    { key: "main2", label: "メインゾーン②", row: 1, col: 4 },
    { key: "sub3",  label: "サブゾーン③",  row: 3, col: 5 }
  ];
  const ZONE_CONNECTORS = [
    { fromCol: 1, toCol: 2, dir: "asc" },  // サブ①→メイン①
    { fromCol: 2, toCol: 3, dir: "desc" }, // メイン①→サブ②
    { fromCol: 3, toCol: 4, dir: "asc" },  // サブ②→メイン②
    { fromCol: 4, toCol: 5, dir: "desc" }  // メイン②→サブ③
  ];
  const ZONE_KEYS = ZONE_DEFS.map(z => z.key);
  const ZONE_LABEL = {}; ZONE_DEFS.forEach(z => { ZONE_LABEL[z.key] = z.label; });
  function emptyField(){ const f = {}; ZONE_KEYS.forEach(k => f[k] = null); return f; }
  function findFieldZone(field, cardId){
    for(const k of ZONE_KEYS){ if(field[k] && field[k].id === cardId) return k; }
    return null;
  }

  // ---------------- Firebase data helpers ----------------
  async function fbGet(path){
    try{
      const snap = await get(ref(db, path));
      return snap.exists() ? snap.val() : null;
    } catch(e){ console.error("fbGet failed", path, e); return null; }
  }
  async function fbSet(path, value){
    try{ await set(ref(db, path), value); }
    catch(e){ console.error("fbSet failed", path, e); }
  }
  async function fbRemove(path){
    try{ await remove(ref(db, path)); }
    catch(e){ console.error("fbRemove failed", path, e); }

  // ---------------- preset deck storage (shared, under /decks) ----------------
  async function loadPresetIndex(){
    const val = await fbGet("decks");
    if(!val) return [];
    return Object.keys(val).map(id => ({

    }));

  async function loadPresetById(id){

  // ---------------- room seat storage (realtime) ----------------
  function defaultSeatState(){
    return { commander:null, deck:[], hand:[], field:emptyField(), discard:[], exclude:[], revealSlot:null, submitted:false, started:false, hp:3, stack:0, stackLabel:"", mulliganDone:false, log:[], updatedAt:0 };
  }
  // Firebase Realtime Databaseは空配列/null/未設定の項目をそのまま保存できず、
  // 読み込み時にキーごと消えることがあるため、読み込んだデータは必ずこれで補完する。
  function normalizeSeat(raw){
    if(!raw) return null;
    const rawField = raw.field || {};
    const field = emptyField();
    ZONE_KEYS.forEach(k => { field[k] = rawField[k] || null; });
    return {
      commander: raw.commander || null,
      deck: raw.deck || [],
      hand: raw.hand || [],
      field: field,
      discard: raw.discard || [],
      exclude: raw.exclude || [],
      revealSlot: raw.revealSlot || null,
      submitted: !!raw.submitted,
      started: !!raw.started,
      hp: typeof raw.hp === "number" ? raw.hp : 3,
      stack: typeof raw.stack === "number" ? raw.stack : 0,
      stackLabel: raw.stackLabel || "",
      mulliganDone: !!raw.mulliganDone,
      log: raw.log || [],
      updatedAt: raw.updatedAt || 0
    };
  }
  function normalizeShared(raw){
    return {
      turnState: (raw && raw.turnState) || "normal",
      currentTurn: (raw && raw.currentTurn) || null,
      turnNumber: (raw && typeof raw.turnNumber === "number") ? raw.turnNumber : 0,
      gameInitialized: !!(raw && raw.gameInitialized),
      dealt: !!(raw && raw.dealt),
      firstPlayer: (raw && raw.firstPlayer) || null,
      ended: !!(raw && raw.ended)
    };
  }
  async function saveSeat(seat, obj){
    obj.updatedAt = Date.now();
    await fbSet(`rooms/${roomCode}/${seat}`, obj);
  }
  async function saveShared(obj){
    obj.updatedAt = Date.now();
    await fbSet(`rooms/${roomCode}/shared`, obj);
  }
  function attachRoomListeners(){
    detachRoomListeners();
    unsubA = onValue(ref(db, `rooms/${roomCode}/A`), (snap) => {
      state.A = normalizeSeat(snap.exists() ? snap.val() : null);
      connStatus.A = true;
      render();
    }, (err) => { console.error(err); connStatus.A = false; render(); });
    unsubB = onValue(ref(db, `rooms/${roomCode}/B`), (snap) => {
      state.B = normalizeSeat(snap.exists() ? snap.val() : null);
      connStatus.B = true;
      render();
    }, (err) => { console.error(err); connStatus.B = false; render(); });
    unsubShared = onValue(ref(db, `rooms/${roomCode}/shared`), (snap) => {
      const newShared = normalizeShared(snap.exists() ? snap.val() : null);
      const wasInitialized = sharedState.gameInitialized;
      sharedState = newShared;
      if(wasInitialized && !newShared.gameInitialized && !newShared.dealt && !newShared.ended && screen === "game"){
        enterDeckSetup();
      } else {
        render();
      }
    }, (err) => { console.error(err); });
  }
  function detachRoomListeners(){
    if(unsubA){ unsubA(); unsubA = null; }
    if(unsubB){ unsubB(); unsubB = null; }
    if(unsubShared){ unsubShared(); unsubShared = null; }
    connStatus = { A:false, B:false };
    sharedState = normalizeShared(null);
  }
  function addLog(seatObj, text){
    seatObj.log = seatObj.log || [];
    seatObj.log.push({ ts: nowLabel(), text });

  // ---------------- deck builder helpers ----------------
  let editingCardGroupSig = null;
  function cardSignature(c){
    return [c.color,c.name,c.affiliation,c.status,c.seinenba,c.effect1,c.effect2,c.counterLabel||""].join("\u0001");
  }
  function addDraftCard(){
    const f = draft.formCard;
    if(!f.name.trim()){ errorMsg = "カード名を入力してください。"; render(); return; }
    const statusNum = parseInt(f.status, 10);
    const seinenbaNum = parseInt(f.seinenba, 10);
    let qty = parseInt(f.qty, 10);
    if(isNaN(qty) || qty < 1) qty = 1;
    if(editingCardGroupSig){
      draft.cards = draft.cards.filter(c => cardSignature(c) !== editingCardGroupSig);
      editingCardGroupSig = null;
    }
    for(let i=0;i<qty;i++){
      draft.cards.push({
        id: uid(), color: f.color.trim(), name: f.name.trim(), affiliation: f.affiliation.trim(),
        status: isNaN(statusNum) ? 0 : statusNum, seinenba: isNaN(seinenbaNum) ? 0 : seinenbaNum,
        effect1: f.effect1.trim(), effect2: f.effect2.trim(), counterLabel: f.counterLabel.trim()
      });
    }
    draft.formCard = { color:f.color, name:"", affiliation:f.affiliation, status:"", seinenba:"", effect1:"", effect2:"", counterLabel:f.counterLabel, qty:"1" };
    errorMsg = ""; render();
  }
  function startEditCardGroup(signature){
    const sample = draft.cards.find(c => cardSignature(c) === signature);
    if(!sample) return;
    const count = draft.cards.filter(c => cardSignature(c) === signature).length;
    draft.formCard = {
      color: sample.color || "", name: sample.name || "", affiliation: sample.affiliation || "",
      status: String(sample.status ?? ""), seinenba: String(sample.seinenba ?? ""),
      effect1: sample.effect1 || "", effect2: sample.effect2 || "",
      counterLabel: sample.counterLabel || "", qty: String(count)
    };
    editingCardGroupSig = signature;
    errorMsg = "";
    render();
  }
  function cancelEditCardGroup(){
    editingCardGroupSig = null;
    draft.formCard = { color:"", name:"", affiliation:"", status:"", seinenba:"", effect1:"", effect2:"", counterLabel:"", qty:"1" };
    render();
  }
  function removeDraftCardGroup(signature){
    draft.cards = draft.cards.filter(c => cardSignature(c) !== signature);
    if(editingCardGroupSig === signature) cancelEditCardGroup();
    else render();
  }
  function cardsToBulkText(){
    return draft.cards.map(c => [c.color,c.name,c.affiliation,c.status,c.seinenba,c.effect1,c.effect2,c.counterLabel||""].join("|")).join("\n");
  }
  function parseBulkText(text){
    const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
    const out = [];
    lines.forEach(line => {
      const parts = line.split("|").map(p => p.trim());
      const [color="", name="", affiliation="", status="", seinenba="", effect1="", effect2="", counterLabel="", qtyStr=""] = parts;
      let qty = parseInt(qtyStr, 10);
      if(isNaN(qty) || qty < 1) qty = 1;
      for(let i=0;i<qty;i++){
        out.push({ id: uid(), color, name, affiliation, status: parseInt(status,10) || 0, seinenba: parseInt(seinenba,10) || 0, effect1, effect2, counterLabel });
      }
    });
    return out;
  }
  function switchToBulk(){ draft.bulkText = cardsToBulkText(); deckTab = "bulk"; render(); }
  function switchToForm(){ if(draft.bulkText.trim()){ draft.cards = parseBulkText(draft.bulkText); } deckTab = "form"; render(); }

  async function savePresetDraft(){
    if(deckTab === "bulk" && draft.bulkText.trim()){ draft.cards = parseBulkText(draft.bulkText); }
    if(!draft.deckName.trim()){ errorMsg = "デッキ名を入力してください。"; render(); return; }

    if(draft.cards.length === 0){ errorMsg = "デッキカードを1枚以上登録してください。"; render(); return; }
    const id = editingPresetId || uid();
    const obj = {
      name: draft.deckName.trim(),
      commander: { affiliation: draft.commander.affiliation.trim(), name: draft.commander.name.trim(), effect: draft.commander.effect.trim() },
      stackLabel: draft.stackLabel.trim(),
      cards: draft.cards, updatedAt: Date.now()
    };

  // ---------------- room flow ----------------
  async function enterDeckSetup(){
    if(!roomCode || !mySeat) return; // 退室済みなら何もしない
    deckSetupPresets = await loadPresetIndex();
    if(!roomCode || !mySeat) return; // 待機中に退室していたら反映しない
    selectedPresetId = null; selectedPresetDetail = null; errorMsg = "";
    screen = "deckSetup"; render();
  }
  async function selectPreset(id){
    selectedPresetId = id;
    selectedPresetDetail = await loadPresetById(id);
    render();
  }
  async function submitSelectedPreset(){
    if(!selectedPresetId){ errorMsg = "デッキを選んでください。"; render(); return; }
    const preset = selectedPresetDetail || await loadPresetById(selectedPresetId);
    if(!preset){ errorMsg = "デッキの読み込みに失敗しました。"; render(); return; }
    const s = defaultSeatState();
    s.commander = { affiliation: preset.commander.affiliation, name: preset.commander.name, effect: preset.commander.effect };
    s.deck = preset.cards.map(c => ({ ...c, id: uid(), counter: 0, statAdjust: 0 }));
    s.stackLabel = preset.stackLabel || "";
    s.stack = 0;
    s.submitted = true;
    addLog(s, `デッキ『${preset.name}』を登録した(本隊${s.deck.length}枚 + 指揮官)`);
    await saveSeat(mySeat, s);
    state[mySeat] = s;
    screen = "waiting"; errorMsg = "";
    render();

  async function startGame(){
    const s = state[mySeat];
    s.deck = shuffle(s.deck);
    s.started = true;
    mulliganSelected = [];
    addLog(s, "デッキをシャッフルしてゲームを開始した");
    await saveSeat(mySeat, s);
    screen = "game"; render();
  }
  async function redoDeckSelection(){
    const s = defaultSeatState();
    await saveSeat(mySeat, s);
    state[mySeat] = s;
    await enterDeckSetup();
  }

  // ---------------- game actions ----------------
  async function drawCard(){
    const s = state[mySeat];
    if(s.deck.length === 0) return;
    const card = s.deck.shift();
    s.hand.push(card);
    addLog(s, "山札から1枚ドローした");
    await saveSeat(mySeat, s); render();
  }
  async function manualShuffle(){
    const s = state[mySeat];
    s.deck = shuffle(s.deck);
    addLog(s, "山札をシャッフルした");
    await saveSeat(mySeat, s); render();
  }
  function openSearch(){ modal = { type:"search" }; render(); }
  function openSearchCardMenu(cardId){ modal = { type:"searchCardMenu", cardId }; render(); }
  async function pickFromSearch(cardId){
    const s = state[mySeat];
    const idx = s.deck.findIndex(c => c.id === cardId);
    if(idx === -1) return;
    const [card] = s.deck.splice(idx, 1);
    s.hand.push(card);
    s.deck = shuffle(s.deck);
    addLog(s, `デッキカード移動で『${card.name}』を手札に加えた`);
    modal = null;
    await saveSeat(mySeat, s); render();
  }
  async function sendSearchToDiscard(cardId){
    const s = state[mySeat];
    const idx = s.deck.findIndex(c => c.id === cardId);
    if(idx === -1) return;
    const [card] = s.deck.splice(idx, 1);
    s.discard.push(card);
    s.deck = shuffle(s.deck);
    addLog(s, `デッキカード移動で『${card.name}』を墓地に送った`);
    modal = null;
    await saveSeat(mySeat, s); render();
  }
  async function playFromDeckToZone(cardId, zoneKey){
    const s = state[mySeat];
    if(s.field[zoneKey]) return;
    const idx = s.deck.findIndex(c => c.id === cardId);
    if(idx === -1) return;
    const [card] = s.deck.splice(idx, 1);
    s.field[zoneKey] = card;
    s.deck = shuffle(s.deck);
    addLog(s, `デッキカード移動で『${card.name}』を${ZONE_LABEL[zoneKey]}に緊急招来した`);
    modal = null;
    await saveSeat(mySeat, s); render();

  function cancelModal(){ modal = null; render(); }
  function openHandCardMenu(cardId){ modal = { type:"handCard", cardId }; render(); }
  function openFieldCardMenu(cardId){ modal = { type:"fieldCard", cardId }; render(); }
  function openCommanderView(seat){ modal = { type:"commander", seat }; render(); }
  function openChooseZone(cardId, source){ modal = { type:"chooseZone", cardId, source: source || "hand" }; render(); }
  async function adjustCounter(cardId, delta){
    const s = state[mySeat];
    const card = s.hand.find(c => c.id === cardId) || Object.values(s.field).find(c => c && c.id === cardId) || s.discard.find(c => c.id === cardId);
    if(!card) return;
    card.counter = Math.max(0, (card.counter || 0) + delta);
    await saveSeat(mySeat, s); render();
  }
  async function adjustFieldStat(cardId, delta){
    const s = state[mySeat];
    const zoneKey = findFieldZone(s.field, cardId);
    if(!zoneKey) return;
    const card = s.field[zoneKey];
    let next = (card.statAdjust || 0) + delta;
    if(card.status + next < 0) next = -card.status; // 合計が0未満にならないようにする
    card.statAdjust = next;
    addLog(s, `『${card.name}』のステータスを${delta > 0 ? "+" : ""}${delta}調整した(現在${fmtMod(card.statAdjust)})`);
    await saveSeat(mySeat, s); render();
  }
  async function resetFieldStat(cardId){
    const s = state[mySeat];
    const zoneKey = findFieldZone(s.field, cardId);
    if(!zoneKey) return;
    const card = s.field[zoneKey];
    card.statAdjust = 0;
    addLog(s, `『${card.name}』のステータス調整を元に戻した`);
    await saveSeat(mySeat, s); render();
  }
  async function adjustHp(delta){
    const s = state[mySeat];
    s.hp = Math.max(0, Math.min(3, (typeof s.hp === "number" ? s.hp : 3) + delta));
    addLog(s, `体力を${delta > 0 ? "回復" : "減少"}した(現在${s.hp})`);
    await saveSeat(mySeat, s); render();
  }
  async function adjustStack(delta){
    const s = state[mySeat];
    s.stack = Math.max(0, (typeof s.stack === "number" ? s.stack : 0) + delta);
    addLog(s, `「${s.stackLabel || 'スタック'}」を${delta > 0 ? "+1" : "-1"}した(現在${s.stack})`);
    await saveSeat(mySeat, s); render();
  }

  async function playToZone(cardId, zoneKey){
    const s = state[mySeat];
    if(s.field[zoneKey]) return; // そのゾーンは既に埋まっている
    const idx = s.hand.findIndex(c => c.id === cardId);
    if(idx === -1) return;
    const [card] = s.hand.splice(idx, 1);
    s.field[zoneKey] = card;
    addLog(s, `『${card.name}』を${ZONE_LABEL[zoneKey]}に通常招来した`);
    modal = null;
    await saveSeat(mySeat, s); render();
  }
  async function moveFieldToZone(cardId, targetZone){
    const s = state[mySeat];
    const fromZone = findFieldZone(s.field, cardId);
    if(!fromZone){ modal = null; render(); return; }
    if(fromZone === targetZone){ modal = null; render(); return; }
    const movingCard = s.field[fromZone];
    const targetCard = s.field[targetZone];
    s.field[fromZone] = targetCard || null;
    s.field[targetZone] = movingCard;
    if(targetCard){
      addLog(s, `『${movingCard.name}』と『${targetCard.name}』を入れ替えた(${ZONE_LABEL[fromZone]}⇔${ZONE_LABEL[targetZone]})`);
    } else {
      addLog(s, `『${movingCard.name}』を${ZONE_LABEL[fromZone]}から${ZONE_LABEL[targetZone]}に移動した`);
    }
    modal = null;
    await saveSeat(mySeat, s); render();
  }

  // ---------------- drag & drop ----------------
  function onCardDragStart(e, cardId, source){
    dragData = { cardId, source };
    try{
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", cardId);
    } catch(err){ /* 一部ブラウザでの制約は無視 */ }
  }
  async function onZoneDrop(e, zoneKey){
    e.preventDefault();
    if(e.currentTarget) e.currentTarget.classList.remove("zone-drag-over");
    if(!dragData) return;
    const { cardId, source } = dragData;
    dragData = null;
    if(source === "hand") await playToZone(cardId, zoneKey);
    else if(source === "field") await moveFieldToZone(cardId, zoneKey);
  }
  async function onHandDrop(e){

  // ゲーム開始時の初期化(先攻/後攻決定・初期手札6枚ドロー・最初のターン設定)
  // 席Aのクライアントのみが実行することで、二重実行による重複ドローを防ぐ。
  // 第1段階: 初期手札6枚を配る(まだターンは始めない。マリガン待ち状態にする)
  async function maybeDealInitialHands(){
    if(mySeat !== "A" || gameInitInProgress) return;
    const a = state.A, b = state.B;
    if(!a || !b || !a.started || !b.started) return;
    if(sharedState.dealt) return;
    gameInitInProgress = true;
    try{
      const first = Math.random() < 0.5 ? "A" : "B";
      const aCopy = { ...a, deck: [...a.deck], hand: [...a.hand], log: [...(a.log||[])] };
      for(let i=0;i<6;i++){ if(aCopy.deck.length) aCopy.hand.push(aCopy.deck.shift()); }
      addLog(aCopy, "初期手札6枚をドローした");
      await saveSeat("A", aCopy);
      const bCopy = { ...b, deck: [...b.deck], hand: [...b.hand], log: [...(b.log||[])] };
      for(let i=0;i<6;i++){ if(bCopy.deck.length) bCopy.hand.push(bCopy.deck.shift()); }
      addLog(bCopy, "初期手札6枚をドローした");
      await saveSeat("B", bCopy);
      await saveShared({ turnState: "normal", currentTurn: null, turnNumber: 0, gameInitialized: false, dealt: true, firstPlayer: first, ended: false });
      state.A = aCopy; state.B = bCopy;
      render();
    } finally {
      gameInitInProgress = false;
    }
  }

  async function maybeStartTurnsAfterMulligan(){
    if(mySeat !== "A" || gameInitInProgress) return;
    const a = state.A, b = state.B;
    if(!a || !b || !sharedState.dealt || sharedState.gameInitialized) return;
    if(!a.mulliganDone || !b.mulliganDone) return;
    gameInitInProgress = true;
    try{
      const hit = Math.floor(Math.random()*3) === 0;
      await saveShared({ turnState: hit ? "seinenba" : "normal", currentTurn: sharedState.firstPlayer || "A", turnNumber: 1, gameInitialized: true, dealt: true, firstPlayer: sharedState.firstPlayer || "A", ended: false });
      render();
    } finally {
      gameInitInProgress = false;
    }
  }

  async function confirmMulligan(doMulligan){
    const s = state[mySeat];
    if(doMulligan && mulliganSelected.length > 0){
      const returning = s.hand.filter(c => mulliganSelected.indexOf(c.id) !== -1);
      s.hand = s.hand.filter(c => mulliganSelected.indexOf(c.id) === -1);
      s.deck = shuffle([...s.deck, ...returning]);
      for(let i=0;i<returning.length;i++){ if(s.deck.length) s.hand.push(s.deck.shift()); }
      addLog(s, `マリガンで${returning.length}枚を交換した`);
    } else {
      addLog(s, "マリガンせずそのまま始めた");
    }
    s.mulliganDone = true;
    mulliganSelected = [];
    await saveSeat(mySeat, s);
    state[mySeat] = s;
    await maybeStartTurnsAfterMulligan();
    render();

      const counterRow = c.counterLabel ? `

  async function endTurn(){
    if(sharedState.currentTurn !== mySeat) return;
    const nextSeat = otherSeat(mySeat);
    const hit = Math.floor(Math.random()*3) === 0;
    const newTurnNumber = (sharedState.turnNumber || 1) + 1;
    const nextData = state[nextSeat];
    if(nextData){
      const copy = { ...nextData, deck: [...nextData.deck], hand: [...nextData.hand], log: [...(nextData.log||[])] };
      if(copy.deck.length){
        copy.hand.push(copy.deck.shift());
        addLog(copy, `ターン${newTurnNumber}を開始し、ドローした`);
      } else {
        copy.hp = 0;
        addLog(copy, `ターン${newTurnNumber}開始時に山札が0枚でドローできず、敗北した`);
      }
      await saveSeat(nextSeat, copy);
      state[nextSeat] = copy;
    }
    await saveShared({ ...sharedState, turnState: hit ? "seinenba" : "normal", currentTurn: nextSeat, turnNumber: newTurnNumber, gameInitialized: true });
    const s = state[mySeat];
    addLog(s, "ターンを終了した");
    await saveSeat(mySeat, s); render();
  }

  async function enterRoom(){

  function renderSpectate(){
    if(!roomCode){
      app.innerHTML = `
        <h1 class="title display">偉人カードゲーム</h1>
        <div class="panel"><div class="hint">部屋情報が見つかりません。</div>
        <button class="primary full" id="backHomeBtn" style="margin-top:14px;">ホームに戻る</button></div>
      `;
      const btn = document.getElementById("backHomeBtn");
      if(btn) btn.onclick = leaveRoom;
      return;
    }
    const a = state.A, b = state.B;

    function sideHtml(seatData, seatLabel, reversed){
      if(!seatData){
        return `<div class="zone"><div class="zone-label"><span>席${seatLabel}</span></div><div class="empty-note">まだ準備中です</div></div>`;
      }
      const handCards = seatData.hand.map(c => cardHtml(c, "noop", seatLabel, false)).join("");
      const infoBlock = `
        <div class="zone">
          <div class="zone-label"><span>席${seatLabel}</span></div>
          <div class="info-row">
            <div class="info-col">${commanderHtml(seatData.commander, seatLabel)}</div>
            <div class="info-col">${hpHtml(seatData, false)}${stackHtml(seatData, false)}</div>
            <div class="info-col">
              <div class="zone-slot-label" style="text-align:left; margin-bottom:6px;">手札 ${seatData.hand.length}枚</div>
              <div class="cards-row">${handCards || `<div class="empty-note">なし</div>`}</div>
            </div>
          </div>
        </div>
      `;
      const fieldBlock = `
        <div class="zone">
          <div class="zone-label">
            <span>席${seatLabel}の場</span>
            <span class="row" style="gap:10px;">
              <span class="mono" style="opacity:0.6; cursor:pointer;" data-peek="discard:${seatLabel}">墓地(${seatData.discard.length})</span>
              <span class="mono" style="opacity:0.6; cursor:pointer;" data-peek="exclude:${seatLabel}">除外(${seatData.exclude.length})</span>
            </span>
          </div>
          ${zoneBoardHtml(seatData.field, seatLabel, false, seatData.revealSlot)}
        </div>
      `;
      return reversed ? (fieldBlock + infoBlock) : (infoBlock + fieldBlock);
    }

    let mergedLog = [];
    if(a && a.log) mergedLog = mergedLog.concat(a.log.map(e => ({...e, who: "A"})));
    if(b && b.log) mergedLog = mergedLog.concat(b.log.map(e => ({...e, who: "B"})));
    mergedLog.sort((x,y) => (x.ts > y.ts ? 1 : -1));
    mergedLog = mergedLog.slice(-30);

  function modalHtmlSpectate(){
    if(!modal) return "";
    if(modal.type === "peekDiscard" || modal.type === "peekExclude"){
      const seat = modal.seat;
      const target = state[seat];
      const key = modal.type === "peekDiscard" ? "discard" : "exclude";
      const title = modal.type === "peekDiscard" ? `席${seat}の墓地` : `席${seat}の除外ゾーン`;

      `);
    }

  function statusHtml(card){
    const active = sharedState.turnState === "seinenba";
    const adjust = card.statAdjust || 0;
    const val = card.status + (active ? card.seinenba : 0) + adjust;
    const modified = adjust !== 0;
    return `<span class="status ${active?'sein':''} ${modified?'adj':''}">${val}</span> <span style="opacity:0.5; font-size:10px;">(通常${card.status} / 正念場${fmtMod(card.seinenba)}${modified ? ` / 調整${fmtMod(adjust)}` : ""})</span>`;

  function cardHtml(card, onclickName, seat, editableCounter, dragSource, inlineEffect, statAdjustable){
    const counterRow = card.counterLabel ? `
      <div class="counter-row" onclick="event.stopPropagation();">
        <span>${escapeHtml(card.counterLabel)}: ${card.counter||0}</span>
        ${editableCounter ? `
          <button onclick="event.stopPropagation(); adjustCounter('${card.id}',-1)">−</button>
          <button onclick="event.stopPropagation(); adjustCounter('${card.id}',1)">＋</button>
        ` : ""}
      </div>
    ` : "";
    const statAdjustRow = (statAdjustable && editableCounter) ? `
      <div class="stat-adjust-row" onclick="event.stopPropagation();">
        <button onclick="event.stopPropagation(); adjustFieldStat('${card.id}',-100)">−100</button>
        <button onclick="event.stopPropagation(); adjustFieldStat('${card.id}',100)">＋100</button>
        ${card.statAdjust ? `<button class="reset" onclick="event.stopPropagation(); resetFieldStat('${card.id}')">戻す</button>` : ""}
      </div>
    ` : "";
    const effectParts = [];
    if(card.effect1) effectParts.push("①" + card.effect1);
    if(card.effect2) effectParts.push("②" + card.effect2);
    const effectIcon = (!inlineEffect && effectParts.length) ? `
      <span class="effect-icon" data-effect="${escapeHtml(effectParts.join("\n"))}"
        onmouseenter="showEffectTip(event)" onmouseleave="hideEffectTip()">効果</span>
    ` : "";
    const effectLines = inlineEffect ? effectParts.map(p => `<div class="ceffect">${escapeHtml(p)}</div>`).join("") : "";
    const dragAttrs = dragSource ? `draggable="true" ondragstart="onCardDragStart(event,'${card.id}','${dragSource}')"` : "";
    return `
      <div class="card${dragSource ? ' draggable' : ''}" ${dragAttrs} onclick="${onclickName}('${card.id}')">
        <div class="toprow"><span class="swatch" style="background:${colorSwatch(card.color)};"></span>${statusHtml(card)}</div>
        <div class="cname">${escapeHtml(card.name)}</div>
        <div class="caff-row">
          <span class="caff">${escapeHtml(card.affiliation || "")}</span>
          ${effectIcon}
        </div>
        ${effectLines}
        ${counterRow}
        ${statAdjustRow}
      </div>
    `;

  function gameOverOverlayHtml(mine, opp){

  function hpHtml(seatObj, editable){

  function cardBackHtml(seatLetter){ return `<div class="card back ${seatLetter}"></div>`; }
  function commanderHtml(cmd, seat){
    if(!cmd) return `<div class="empty-note">未設定</div>`;

    return `

        </div>
      </div>
    `;

  const BOARD_COL_W = 132, BOARD_GAP = 10, BOARD_STEP = BOARD_COL_W + BOARD_GAP;
  function colCenterPx(colIndex){ return (colIndex - 1) * BOARD_STEP + BOARD_COL_W / 2; }
  function connectorsHtmlBuild(colW, gap){
    colW = colW || BOARD_COL_W; gap = gap == null ? BOARD_GAP : gap;
    const step = colW + gap;
    const centerPx = (colIndex) => (colIndex - 1) * step + colW / 2;
    return ZONE_CONNECTORS.map(c => {
      const xA = centerPx(c.fromCol), xB = centerPx(c.toCol);
      const left = Math.min(xA, xB), width = Math.abs(xB - xA);
      return `
        <svg class="zone-connector-line" style="left:${left}px; width:${width}px;" viewBox="0 0 100 100" preserveAspectRatio="none">
          <line x1="0" y1="${c.dir === 'asc' ? 100 : 0}" x2="100" y2="${c.dir === 'asc' ? 0 : 100}" vector-effect="non-scaling-stroke" />
        </svg>
      `;
    }).join("");
  }
  function zonePickerGridHtml(mine, currentZone, allowSwap){
    const colW = 78, gap = 8;
    return `
      <div class="zone-board-wrap">
        <div class="zone-board picker" style="grid-template-columns: repeat(5, ${colW}px); gap: 4px ${gap}px; min-width: ${colW*5 + gap*4}px;">
          <div class="zone-connectors" style="grid-column:1 / -1; grid-row:2;">${connectorsHtmlBuild(colW, gap)}</div>
          ${ZONE_DEFS.map(z => {
            const isCurrent = z.key === currentZone;
            const occupied = !!mine.field[z.key] && !isCurrent;
            const disabled = isCurrent || (occupied && !allowSwap);
            return `

                <button class="zone-pick-cell" data-zone="${z.key}" ${disabled ? "disabled" : ""}>

        </div>
      </div>
    `;
  }

  function zoneBoardHtml(fieldObj, seat, editable, revealCard){

    return `
      <div class="zone-board-wrap">

            return `

  function renderGame(){
    const mySeatKey = mySeat;

    const opp = oppSeatKey ? state[oppSeatKey] : null;
    if(!roomCode || !mySeatKey || !mine){
      app.innerHTML = `
        <h1 class="title display">偉人カードゲーム</h1>

          <div class="hint">対戦データが見つかりません。相手がゲームを終了したか、通信状況の問題かもしれません。</div>
          <button class="primary full" id="backHomeBtn" style="margin-top:14px;">ホームに戻る</button>
        </div>

    const bothStarted = mine.started && opp && opp.started;

    const isMyTurn = sharedState.currentTurn === mySeatKey;

    const mulliganPhase = bothStarted && sharedState.dealt && !sharedState.gameInitialized;

    let mergedLog = [];
    if(mine.log) mergedLog = mergedLog.concat(mine.log.map(e => ({...e, who: mySeatKey})));
    if(opp && opp.log) mergedLog = mergedLog.concat(opp.log.map(e => ({...e, who: oppSeatKey})));
    mergedLog.sort((a,b) => (a.ts > b.ts ? 1 : -1));
    mergedLog = mergedLog.slice(-30);
    const logHtml = mergedLog.map(e => `<div class="log-entry"><span class="mono" style="opacity:0.6;">[${e.ts}]</span> <b style="color:${e.who==='A'?'var(--seat-a)':'var(--seat-b)'}">席${e.who}</b> ${escapeHtml(e.text)}</div>`).join("") || `<div class="empty-note">まだ操作がありません</div>`;

    app.innerHTML = `

            <span class="hint" style="margin:0;">正念場: <b style="color:${sharedState.turnState==='seinenba'?'var(--danger)':'inherit'};">${sharedState.turnState==='seinenba' ? "発生中" : "通常"}</b></span>

    return `
      <div class="modal-detail-row"><b>${escapeHtml(card.name)}</b> ${card.affiliation ? `／ ${escapeHtml(card.affiliation)}` : ""}</div>
      <div class="modal-detail-row">属性: ${escapeHtml(card.color || "—")} ／ ${statusHtml(card, seat)}</div>
      ${card.effect1 ? `<div class="modal-detail-row">①${escapeHtml(card.effect1)}</div>` : ""}
      ${card.effect2 ? `<div class="modal-detail-row">②${escapeHtml(card.effect2)}</div>` : ""}
      ${card.counterLabel ? `
        <div class="modal-detail-row">
          「${escapeHtml(card.counterLabel)}」カウンター: ${card.counter||0}
          ${editableCounter ? `
            <button class="act" style="padding:4px 10px; margin-left:8px;" onclick="adjustCounter('${card.id}',-1)">−1</button>
            <button class="act" style="padding:4px 10px;" onclick="adjustCounter('${card.id}',1)">＋1</button>
          ` : ""}
        </div>
      ` : ""}
    `;
  }

  function modalHtml(mine, opp, mySeatKey, oppSeatKey){
    if(!modal) return "";
    if(modal.type === "confirmEndGame"){
      return overlayWrap(`
        <h3 class="display">ゲームを終了しますか？</h3>
        <div class="hint">お互いの手札・場・山札などの情報がすべて破棄されます。終了後は同じ部屋番号で新しく対戦を始められます。</div>
        <div class="row" style="margin-top:16px;">
          <button class="ghost" id="modalCancel">キャンセル</button>
          <button class="primary" id="modalConfirmEndGame" style="background:var(--danger); color:#fff;">終了する</button>
        </div>
      `);
    }
    if(modal.type === "search"){
      const cards = mine.deck.map(c => cardHtml(c, "openSearchCardMenu", mySeatKey, false)).join("");
      return overlayWrap(`
        <h3 class="display">デッキカード移動</h3>
        <div class="hint">カードをクリックすると、手札・墓地・場のどこに移動するか選べます。残りの山札は自動でシャッフルされます。</div>
        <div class="modal-cards">${cards || `<div class="empty-note">山札にカードがありません</div>`}</div>
        <button class="ghost" id="modalCancel">キャンセル</button>
      `);
    }
    if(modal.type === "searchCardMenu"){
      const card = mine.deck.find(c => c.id === modal.cardId);
      if(!card){ modal = null; return ""; }
      return overlayWrap(`
        <h3 class="display">カード詳細</h3>${cardDetailBlock(card, mySeatKey, false)}
        <div class="row" style="flex-wrap:wrap; margin-top:14px;">
          <button class="act" id="mSearchToHand">手札に加える</button>
          <button class="act" id="mSearchToDiscard">墓地に送る</button>
          <button class="act" id="mSearchToField">緊急招来する</button>
        </div>
        <div style="margin-top:14px;" class="row">
          <button class="ghost" id="mBackToSearchList">山札一覧に戻る</button>
          <button class="ghost" id="modalCancel">キャンセル</button>
        </div>
      `);
    }
    if(modal.type === "handCard"){
      const card = mine.hand.find(c => c.id === modal.cardId);
      if(!card){ modal = null; return ""; }
      return overlayWrap(`
        <h3 class="display">カード詳細</h3>${cardDetailBlock(card, mySeatKey, true)}
        <div class="row" style="flex-wrap:wrap; margin-top:14px;">
          <button class="act" id="mPlay">通常招来する</button>
          <button class="act" id="mDiscard">墓地に送る</button>
          <button class="act" id="mReturn">山札の一番上に戻す</button>
          <button class="act" id="mReveal">相手に見せる(公開)</button>
          <button class="act" id="mExcludeHand" style="color:#e2a08a;">除外する</button>
        </div>
        <div style="margin-top:14px;"><button class="ghost" id="modalCancel">キャンセル</button></div>
      `);
    }
    if(modal.type === "fieldCard"){
      const zoneKey = findFieldZone(mine.field, modal.cardId);
      const card = zoneKey ? mine.field[zoneKey] : null;
      if(!card){ modal = null; return ""; }
      return overlayWrap(`
        <h3 class="display">カード詳細 <span style="font-size:12px; opacity:0.6; font-weight:400;">(${ZONE_LABEL[zoneKey]})</span></h3>${cardDetailBlock(card, mySeatKey, true)}
        <div class="row" style="flex-wrap:wrap; margin-top:14px;">
          <button class="act" id="mMoveZone">他のゾーンに移動</button>
          <button class="act" id="mReturnHand">手札に戻す</button>
          <button class="act" id="mDiscardField">墓地に送る</button>
          <button class="act" id="mExcludeField" style="color:#e2a08a;">除外する</button>
        </div>
        <div style="margin-top:14px;"><button class="ghost" id="modalCancel">キャンセル</button></div>
      `);
    }
    if(modal.type === "chooseZone"){
      const source = modal.source || "hand";
      const card = source === "hand" ? mine.hand.find(c => c.id === modal.cardId)
        : source === "field" ? Object.values(mine.field).find(c => c && c.id === modal.cardId)
        : source === "discard" ? mine.discard.find(c => c.id === modal.cardId)
        : source === "deck" ? mine.deck.find(c => c.id === modal.cardId)
        : mine.exclude.find(c => c.id === modal.cardId);
      if(!card){ modal = null; return ""; }
      const currentZone = source === "field" ? findFieldZone(mine.field, modal.cardId) : null;
      const titleVerb = source === "field" ? "どこに移動しますか？" : source === "hand" ? "どこに通常招来しますか？" : "どこに緊急招来しますか？";
      return overlayWrap(`
        <h3 class="display">『${escapeHtml(card.name)}』を${titleVerb}</h3>
        <div class="hint">${source === "field" ? "空いているゾーンに移動、または他のカードがいるゾーンを選ぶと入れ替えられます。" : "各ゾーンには1枚までしか置けません。空いているゾーンから選んでください。"}</div>
        ${zonePickerGridHtml(mine, currentZone, source === "field")}
        <button class="ghost" id="modalCancel" style="margin-top:10px;">キャンセル</button>
      `);
    }
    if(modal.type === "commander"){
      const target = modal.seat === mySeatKey ? mine : opp;
      const cmd = target ? target.commander : null;
      if(!cmd){ modal = null; return ""; }
      return overlayWrap(`
        <h3 class="display">指揮官: ${escapeHtml(cmd.name)}</h3>
        <div class="modal-detail-row">肩書: ${escapeHtml(cmd.affiliation || "—")}</div>
        ${cmd.effect ? `<div class="modal-detail-row">${escapeHtml(cmd.effect)}</div>` : ""}
        <div style="margin-top:14px;"><button class="ghost" id="modalCancel">閉じる</button></div>
      `);
    }
    if(modal.type === "peekDiscard"){
      const target = modal.seat === mySeatKey ? mine : opp;
      const isMine = modal.seat === mySeatKey;
      const cards = target ? target.discard.slice().reverse().map(c => cardHtml(c, isMine ? "openDiscardCardMenu" : "noop", modal.seat, false)).join("") : "";
      return overlayWrap(`
        <h3 class="display">席${modal.seat}の墓地</h3>
        ${isMine ? `<div class="hint">カードをクリックすると、手札・山札・場のどこに戻すか選べます。</div>` : ""}
        <div class="modal-cards">${cards || `<div class="empty-note">墓地はありません</div>`}</div>
        <div class="row" style="margin-top:10px;"><button class="ghost" id="modalCancel">閉じる</button></div>
      `);
    }
    if(modal.type === "discardCardMenu"){
      const card = mine.discard.find(c => c.id === modal.cardId);
      if(!card){ modal = null; return ""; }
      return overlayWrap(`
        <h3 class="display">カード詳細</h3>${cardDetailBlock(card, mySeatKey, false)}
        <div class="row" style="flex-wrap:wrap; margin-top:14px;">
          <button class="act" id="mDiscardToHand">手札に加える</button>
          <button class="act" id="mDiscardToDeck">山札に戻す</button>
          <button class="act" id="mDiscardToField">緊急招来する</button>
          <button class="act" id="mDiscardToExclude" style="color:#e2a08a;">除外する</button>
        </div>
        <div style="margin-top:14px;" class="row">
          <button class="ghost" id="mBackToDiscardList">墓地一覧に戻る</button>
          <button class="ghost" id="modalCancel">閉じる</button>
        </div>
      `);
    }
    if(modal.type === "deckExclude"){
      const cards = mine.deck.map(c => cardHtml(c, "excludeFromDeck", mySeatKey, false)).join("");
      return overlayWrap(`
        <h3 class="display">山札から除外するカードを選ぶ</h3>
        <div class="hint">選んだ1枚を除外に送り、残りは自動でシャッフルされます。</div>
        <div class="modal-cards">${cards || `<div class="empty-note">山札にカードがありません</div>`}</div>
        <button class="ghost" id="modalCancel">キャンセル</button>
      `);
    }
    if(modal.type === "peekExclude"){
      const target = modal.seat === mySeatKey ? mine : opp;
      const isMine = modal.seat === mySeatKey;
      const cards = target ? target.exclude.slice().reverse().map(c => cardHtml(c, isMine ? "openExcludeCardMenu" : "noop", modal.seat, false)).join("") : "";
      return overlayWrap(`
        <h3 class="display">席${modal.seat}の除外ゾーン</h3>
        <div class="hint">除外されたカードは基本的にゲーム中に戻ってきません。${isMine ? "誤って送った場合のみ、クリックして手札・山札・場・墓地のいずれかに戻せます。" : ""}</div>
        <div class="modal-cards">${cards || `<div class="empty-note">除外されたカードはありません</div>`}</div>
        <div class="row" style="margin-top:10px;"><button class="ghost" id="modalCancel">閉じる</button></div>
      `);
    }
    if(modal.type === "excludeCardMenu"){
      const card = mine.exclude.find(c => c.id === modal.cardId);
      if(!card){ modal = null; return ""; }
      return overlayWrap(`
        <h3 class="display">カード詳細</h3>${cardDetailBlock(card, mySeatKey, false)}
        <div class="hint">誤って除外してしまった場合の復帰用です。</div>
        <div class="row" style="flex-wrap:wrap; margin-top:14px;">
          <button class="act" id="mExcludeToHand">手札に戻す</button>
          <button class="act" id="mExcludeToDeck">山札に戻す</button>
          <button class="act" id="mExcludeToField">緊急招来する</button>
          <button class="act" id="mExcludeToDiscard">墓地に戻す</button>
        </div>
        <div style="margin-top:14px;" class="row">
          <button class="ghost" id="mBackToExcludeList">除外一覧に戻る</button>
          <button class="ghost" id="modalCancel">閉じる</button>
        </div>
      `);
    }
    if(modal.type === "revealCardMenu"){
      const card = mine.revealSlot;
      if(!card || card.id !== modal.cardId){ modal = null; return ""; }
      return overlayWrap(`
        <h3 class="display">カード詳細</h3>${cardDetailBlock(card, mySeatKey, false)}
        <div class="row" style="flex-wrap:wrap; margin-top:14px;">
          <button class="act" id="mRevealToHand">手札に戻す</button>
          <button class="act" id="mRevealToDiscard">墓地に送る</button>
        </div>
        <div style="margin-top:14px;"><button class="ghost" id="modalCancel">閉じる</button></div>
      `);
    }
    return "";
  }

  function overlayWrap(inner){ return `<div class="overlay" id="overlayBg"><div class="modal">${inner}</div></div>`; }

  const origRender = render;
  render = function(){ hideEffectTip(); origRender(); bindGenericModalButtons(); bindGameModalButtons(); };

  function bindGenericModalButtons(){
    const bg = document.getElementById("overlayBg");
    if(!bg) return;
    bg.addEventListener("click", (e) => { if(e.target === bg) cancelModal(); });
    const c = id => document.getElementById(id);
    if(c("modalCancel")) c("modalCancel").onclick = cancelModal;
    if(c("modalConfirmDelete")) c("modalConfirmDelete").onclick = () => doDeletePreset(modal.id);
    if(c("modalConfirmEndGame")) c("modalConfirmEndGame").onclick = () => doEndGame();
  }
  function bindGameModalButtons(){
    const c = id => document.getElementById(id);
    if(!modal) return;
    if(c("mPlay")) c("mPlay").onclick = () => openChooseZone(modal.cardId, "hand");
    if(c("mMoveZone")) c("mMoveZone").onclick = () => openChooseZone(modal.cardId, "field");
    if(c("mDiscard")) c("mDiscard").onclick = () => discardFromHand(modal.cardId);
    if(c("mReturn")) c("mReturn").onclick = () => returnToDeckTop(modal.cardId);
    if(c("mReturnHand")) c("mReturnHand").onclick = () => returnFieldToHand(modal.cardId);
    if(c("mDiscardField")) c("mDiscardField").onclick = () => discardFromField(modal.cardId);
    if(c("mExcludeHand")) c("mExcludeHand").onclick = () => excludeFromHand(modal.cardId);
    if(c("mReveal")) c("mReveal").onclick = () => revealFromHand(modal.cardId);
    if(c("mExcludeField")) c("mExcludeField").onclick = () => excludeFromField(modal.cardId);
    if(c("mDiscardToHand")) c("mDiscardToHand").onclick = () => pickFromDiscard(modal.cardId);
    if(c("mDiscardToDeck")) c("mDiscardToDeck").onclick = () => returnDiscardToDeckTop(modal.cardId);
    if(c("mDiscardToField")) c("mDiscardToField").onclick = () => openChooseZone(modal.cardId, "discard");
    if(c("mDiscardToExclude")) c("mDiscardToExclude").onclick = () => excludeFromDiscard(modal.cardId);
    if(c("mBackToDiscardList")) c("mBackToDiscardList").onclick = () => { modal = { type: "peekDiscard", seat: mySeat }; render(); };
    if(c("mExcludeToHand")) c("mExcludeToHand").onclick = () => returnExcludeToHand(modal.cardId);
    if(c("mExcludeToDeck")) c("mExcludeToDeck").onclick = () => returnExcludeToDeckTop(modal.cardId);
    if(c("mExcludeToField")) c("mExcludeToField").onclick = () => openChooseZone(modal.cardId, "exclude");
    if(c("mExcludeToDiscard")) c("mExcludeToDiscard").onclick = () => returnExcludeToDiscard(modal.cardId);
    if(c("mRevealToHand")) c("mRevealToHand").onclick = () => returnRevealToHand(modal.cardId);
    if(c("mRevealToDiscard")) c("mRevealToDiscard").onclick = () => sendRevealToDiscard(modal.cardId);
    if(c("mBackToExcludeList")) c("mBackToExcludeList").onclick = () => { modal = { type: "peekExclude", seat: mySeat }; render(); };
    if(c("mSearchToHand")) c("mSearchToHand").onclick = () => pickFromSearch(modal.cardId);
    if(c("mSearchToDiscard")) c("mSearchToDiscard").onclick = () => sendSearchToDiscard(modal.cardId);
    if(c("mSearchToField")) c("mSearchToField").onclick = () => openChooseZone(modal.cardId, "deck");
    if(c("mBackToSearchList")) c("mBackToSearchList").onclick = () => { modal = { type: "search" }; render(); };
    document.querySelectorAll("[data-zone]").forEach(el => {
      el.onclick = () => {
        const zoneKey = el.getAttribute("data-zone");
        if(modal.source === "field") moveFieldToZone(modal.cardId, zoneKey);
        else if(modal.source === "discard") playFromDiscardToZone(modal.cardId, zoneKey);
        else if(modal.source === "exclude") playFromExcludeToZone(modal.cardId, zoneKey);
        else if(modal.source === "deck") playFromDeckToZone(modal.cardId, zoneKey);
        else playToZone(modal.cardId, zoneKey);
      };
    });
  }

  window.pickFromSearch = pickFromSearch;
  window.openSearchCardMenu = openSearchCardMenu;
  window.pickFromDiscard = pickFromDiscard;
  window.openDiscardCardMenu = openDiscardCardMenu;
  window.excludeFromDeck = excludeFromDeck;
  window.returnRevealToHand = returnRevealToHand;
  window.openExcludeCardMenu = openExcludeCardMenu;
  window.openRevealCardMenu = openRevealCardMenu;
  window.openCommanderView = openCommanderView;
  window.adjustCounter = adjustCounter;
  window.adjustFieldStat = adjustFieldStat;
  window.resetFieldStat = resetFieldStat;
  window.adjustHp = adjustHp;
  window.adjustStack = adjustStack;
  window.noop = function(){};

  render();
}
</script>
</body>
</html>
