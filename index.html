<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>卓 -Table-</title>
<style>
  :root{
    --felt-1: #16241f; --felt-2: #1f342c;
    --card-face: #f6f1e4; --ink: #241c14; --ink-soft: #5a4f40;
    --brass: #c9a227; --seat-a: #c9852f; --seat-b: #3f7d78; --danger: #8a3a2c;
    --line: rgba(246,241,228,0.14);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; min-height:100vh;
    background: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,0.05), transparent 60%),
                linear-gradient(160deg, var(--felt-1), var(--felt-2) 70%);
    color: var(--card-face);
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    display:flex; flex-direction:column; align-items:center; padding: 28px 14px 60px;
  }
  .display{ font-family: Georgia, "Iowan Old Style", "Hiragino Mincho ProN", serif; }
  .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing:0.03em; }

  .stub{
    position:relative; display:inline-flex; align-items:center; gap:14px;
    background: var(--card-face); color: var(--ink); padding: 10px 22px; border-radius: 3px;
    border: 1.5px dashed rgba(36,28,20,0.35); margin-bottom: 22px;
  }
  .stub::before, .stub::after{ content:""; position:absolute; width:14px; height:14px; background: var(--felt-2); border-radius:50%; top:50%; transform:translateY(-50%); }
  .stub::before{ left:-7px; } .stub::after{ right:-7px; }
  .stub .code{ font-size:22px; font-weight:700; letter-spacing:0.12em; }
  .stub .seat-tag{ font-size:12px; padding:3px 8px; border-radius:2px; color:#fff; }
  .seat-tag.A{ background:var(--seat-a); } .seat-tag.B{ background:var(--seat-b); }

  h1.title{ font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  p.sub{ opacity:0.65; margin:0 0 26px; font-size:14px; }

  .panel{ width:100%; max-width: 640px; background: rgba(0,0,0,0.18); border: 1px solid var(--line); border-radius: 10px; padding: 26px; }
  .field-row{ margin-bottom:16px; }
  .grid2{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .grid3{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:12px; }
  label.small-label{ display:block; font-size:12px; opacity:0.7; margin-bottom:6px; letter-spacing:0.04em; }
  input[type=text], input[type=number], textarea, select{
    width:100%; background: rgba(246,241,228,0.06); border: 1px solid var(--line);
    border-radius: 6px; color: var(--card-face); padding: 9px 11px; font-size: 14.5px; font-family: inherit;
  }
  textarea{ min-height: 140px; resize: vertical; line-height:1.7; }
  input::placeholder, textarea::placeholder{ color: rgba(246,241,228,0.35); }

  .seat-picker{ display:flex; gap:12px; }
  .seat-btn{ flex:1; padding:16px; border-radius:8px; cursor:pointer; border:1.5px solid var(--line); background: rgba(246,241,228,0.04); text-align:center; font-size:15px; transition: all .15s ease; }
  .seat-btn.selA.active{ border-color: var(--seat-a); background: rgba(201,133,47,0.18); }
  .seat-btn.selB.active{ border-color: var(--seat-b); background: rgba(63,125,120,0.18); }
  .seat-btn .dot{ display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px; }
  .seat-btn.selA .dot{ background: var(--seat-a); } .seat-btn.selB .dot{ background: var(--seat-b); }

  button.primary{ background: var(--brass); color: #241c14; border:none; border-radius:7px; padding: 12px 20px; font-size:15px; font-weight:700; cursor:pointer; }
  button.primary:disabled{ opacity:0.35; cursor:not-allowed; }
  button.ghost{ background: transparent; color: var(--card-face); border:1px solid var(--line); border-radius:7px; padding:10px 16px; font-size:14px; cursor:pointer; }
  button.linklike{ background:none; border:none; color:var(--brass); font-size:13.5px; cursor:pointer; text-decoration:underline; padding:4px 0; }
  button.small-add{ background: rgba(201,162,39,0.18); color: var(--brass); border:1px solid rgba(201,162,39,0.5); border-radius:7px; padding:10px 16px; font-size:14px; cursor:pointer; font-weight:700; }
  .full{ width:100%; }
  .row{ display:flex; gap:10px; } .between{ justify-content:space-between; align-items:center; }
  .hint{ font-size:12.5px; opacity:0.6; line-height:1.6; margin-top:8px; }
  .tabbar{ display:flex; gap:6px; margin-bottom:16px; }
  .tabbtn{ flex:1; text-align:center; padding:9px; border-radius:6px; cursor:pointer; font-size:13px; border:1px solid var(--line); opacity:0.6; }
  .tabbtn.active{ opacity:1; background: rgba(201,162,39,0.14); border-color: var(--brass); }

  .built-list{ margin-top:14px; }
  .built-row{ display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:6px; background: rgba(246,241,228,0.04); margin-bottom:6px; font-size:13px; }
  .built-row .swatch{ width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .built-row .grow{ flex:1; }
  .built-row .del{ color:#e2a08a; cursor:pointer; font-size:12px; }
  .count-badge{ font-size:12px; opacity:0.6; }

  .preset-row{ display:flex; align-items:center; gap:12px; padding:14px; border-radius:8px; background: rgba(246,241,228,0.04); border:1.5px solid var(--line); margin-bottom:10px; cursor:pointer; transition: all .12s ease; }
  .preset-row:hover{ border-color: rgba(201,162,39,0.4); }
  .preset-row.active{ border-color: var(--brass); background: rgba(201,162,39,0.12); }
  .preset-row .pname{ font-weight:700; font-size:15px; }
  .preset-row .pmeta{ font-size:12px; opacity:0.6; margin-top:2px; }
  .preset-row .pbuttons{ display:flex; gap:8px; margin-left:auto; }
  .preset-row .pbuttons button{ font-size:12px; padding:6px 10px; }
  .preview-box{ margin-top:16px; padding:16px; border-radius:8px; background: rgba(0,0,0,0.2); border:1px solid var(--line); }
  .preview-cardline{ font-size:12.5px; padding:4px 0; border-bottom:1px dashed var(--line); display:flex; gap:8px; align-items:center; }
  .preview-cardline .swatch{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }

  .status-line{ display:flex; align-items:center; gap:10px; padding:10px 0; }
  .pip{ width:10px; height:10px; border-radius:50%; background:#555; }
  .pip.ready{ background:#7fbf6b; }
  .conn-badge{ font-size:11px; padding:4px 10px; border-radius:20px; display:inline-flex; align-items:center; gap:6px; }
  .conn-badge.ok{ background: rgba(127,191,107,0.15); color:#9fd98c; }
  .conn-badge.bad{ background: rgba(138,58,44,0.25); color:#e2a08a; }

  .board{ width:100%; max-width: 980px; }
  .topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px; flex-wrap:wrap; gap:10px; }
  .zone{ border-radius:10px; padding: 14px 16px; margin-bottom:12px; border:1px solid var(--line); background: rgba(0,0,0,0.15); }
  .zone.mine{ border-color: rgba(201,133,47,0.4); }
  .zone-label{ font-size:11px; letter-spacing:0.08em; opacity:0.6; text-transform:uppercase; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
  .cards-row{ display:flex; flex-wrap:wrap; gap:10px; min-height: 96px; }

  .zone-board-wrap{ overflow-x:auto; padding-bottom:4px; }
  .zone-board{ display:grid; grid-template-columns: repeat(5, 132px); grid-template-rows: auto auto; gap: 22px 10px; padding: 4px 2px 8px; min-width: 700px; }
  .zone-slot{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .zone-slot-label{ font-size:10px; opacity:0.55; letter-spacing:0.05em; text-align:center; }
  .zone-empty{ width:128px; min-height:76px; border:1.5px dashed var(--line); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:11px; opacity:0.35; }

  .zone-picker{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; }
  .zone-pick-btn{
    flex: 1 1 120px; min-width:110px; padding:12px 10px; border-radius:8px; cursor:pointer;
    border:1.5px solid var(--line); background: rgba(246,241,228,0.06); color: var(--card-face);
    font-size:13.5px; display:flex; flex-direction:column; gap:4px; align-items:center;
  }
  .zone-pick-btn:not(:disabled):hover{ border-color: var(--brass); background: rgba(201,162,39,0.12); }
  .zone-pick-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .zone-pick-sub{ font-size:11px; opacity:0.65; }

  .commander-card{ display:inline-flex; flex-direction:column; gap:2px; min-width:180px; background: linear-gradient(135deg, #2a2116, #1c1710); color: var(--card-face); border: 1px solid rgba(201,162,39,0.5); border-radius:8px; padding:10px 12px; cursor:pointer; }
  .commander-card .ctag{ font-size:10px; color:var(--brass); letter-spacing:0.08em; }
  .commander-card .cname{ font-weight:700; font-size:14.5px; }
  .commander-card .caff{ font-size:11.5px; opacity:0.7; }

  .card{ width: 128px; min-height: 108px; background: var(--card-face); color: var(--ink); border-radius: 7px; padding: 8px 9px; box-shadow: 0 2px 5px rgba(0,0,0,0.35); cursor:pointer; font-size:11.5px; line-height:1.3; display:flex; flex-direction:column; gap:3px; border: 1px solid rgba(0,0,0,0.08); transition: transform .1s ease; }
  .card:hover{ transform: translateY(-3px); }
  .card .toprow{ display:flex; justify-content:space-between; align-items:center; }
  .card .swatch{ width:9px; height:9px; border-radius:50%; }
  .card .status{ font-weight:700; font-size:12.5px; }
  .card .status.sein{ color: var(--danger); }
  .card .cname{ font-weight:700; font-size:12.5px; margin-top:1px; }
  .card .caff{ color: var(--ink-soft); font-size:10.5px; }
  .card .ceffect{ color: var(--ink-soft); font-size:10px; }
  .counter-row{ display:flex; align-items:center; gap:5px; font-size:10.5px; margin-top:3px; padding-top:3px; border-top:1px dashed rgba(0,0,0,0.12); color: var(--ink); font-weight:600; }
  .counter-row button{ width:17px; height:17px; line-height:15px; padding:0; font-size:12px; border-radius:3px; border:1px solid rgba(0,0,0,0.2); background:#efe9da; cursor:pointer; }
  .counter-row button:hover{ background:#e2d9c2; }
  .card.back{ background: repeating-linear-gradient(45deg, var(--seat-b), var(--seat-b) 6px, #2e5f5a 6px, #2e5f5a 12px); cursor:default; }
  .card.back.A{ background: repeating-linear-gradient(45deg, var(--seat-a), var(--seat-a) 6px, #a56e26 6px, #a56e26 12px); }

  .deckbox{ display:flex; align-items:center; gap:14px; }
  .deckbox .num{ font-size:26px; font-weight:700; }
  .deckbox .lbl{ font-size:11px; opacity:0.6; }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; }
  button.act{ background: rgba(246,241,228,0.08); color: var(--card-face); border:1px solid var(--line); border-radius:6px; padding:8px 12px; font-size:13px; cursor:pointer; }
  button.act:hover{ background: rgba(246,241,228,0.16); }
  button.act:disabled{ opacity:0.3; cursor:not-allowed; }
  button.act.toggled{ background: rgba(138,58,44,0.35); border-color: var(--danger); }

  .log-panel{ max-height: 150px; overflow-y:auto; font-size:12.5px; opacity:0.75; border-top: 1px solid var(--line); margin-top: 14px; padding-top:10px; }
  .log-entry{ margin-bottom:4px; }

  .overlay{ position:fixed; inset:0; background: rgba(10,15,13,0.72); display:flex; align-items:center; justify-content:center; z-index:50; padding: 20px; }
  .modal{ background: var(--felt-2); border:1px solid var(--line); border-radius:12px; padding: 22px; width:100%; max-width: 560px; max-height:80vh; overflow-y:auto; }
  .modal h3{ margin-top:0; font-size:16px; }
  .modal-cards{ display:flex; flex-wrap:wrap; gap:10px; margin:14px 0; }
  .waiting-overlay{ position:fixed; inset:0; background: rgba(10,15,13,0.55); display:flex; align-items:center; justify-content:center; z-index:40; font-size:15px; text-align:center; padding:20px; }
  .waiting-overlay .box{ background: var(--felt-2); border:1px solid var(--line); border-radius:10px; padding:24px 30px; }
  .empty-note{ opacity:0.45; font-size:12.5px; padding: 6px 2px; }
  .modal-detail-row{ font-size:13.5px; margin-bottom:6px; opacity:0.9; }
  .setup-warning{ max-width:640px; background: rgba(138,58,44,0.18); border:1px solid var(--danger); border-radius:10px; padding:22px; line-height:1.8; font-size:14px; }
  .setup-warning code{ background: rgba(0,0,0,0.3); padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
/* =====================================================================
   Firebase 設定
   ここに、あなたが作成した Firebase プロジェクトの設定値を貼り付けてください。
   Firebaseコンソール → プロジェクトの設定 → 全般 → マイアプリ → SDK の設定と構成 で
   表示される firebaseConfig をそのままコピーして置き換えます。
===================================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyB_XKunxOWnvdJQ5fDntc0Ioud_-KLVOfM",
  authDomain: "card-table-315ab.firebaseapp.com",
  databaseURL: "https://card-table-315ab-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "card-table-315ab",
  storageBucket: "card-table-315ab.firebasestorage.app",
  messagingSenderId: "714968976301",
  appId: "1:714968976301:web:a9e1b1c30ff2fe726aaf24"
};
/* ===================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getDatabase, ref, set, get, remove, onValue
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-database.js";

const app = document.getElementById("app");
const NOT_CONFIGURED = firebaseConfig.apiKey === "YOUR_API_KEY";

if (NOT_CONFIGURED) {
  app.innerHTML = `
    <h1 class="title display">卓 -Table-</h1>
    <div class="setup-warning">
      <b>まだセットアップが完了していません。</b><br><br>
      このファイルの先頭付近にある <code>firebaseConfig</code> を、あなた自身の Firebase プロジェクトの設定値に書き換えてから、もう一度このページを開いてください。<br><br>
      手順が分からない場合は、このファイルを作成した会話に戻って「Firebaseの設定方法を教えて」と聞いてください。
    </div>
  `;
} else {
  runApp();
}

function runApp(){
  const fbApp = initializeApp(firebaseConfig);
  const db = getDatabase(fbApp);

  let roomCode = "";
  let mySeat = null;
  let screen = "home";
  let state = { A: null, B: null };
  let connStatus = { A: false, B: false };
  let unsubA = null, unsubB = null, unsubDecks = null;
  let modal = null;
  let selectedSeatChoice = "A";
  let errorMsg = "";
  let deckTab = "form";

  let presetList = [];
  let deckSetupPresets = [];
  let selectedPresetId = null;
  let selectedPresetDetail = null;
  let editingPresetId = null;
  let presetManagerReturnTo = "home";
  let presetEditorReturnTo = "presetManager";

  function freshDraft(){
    return {
      deckName: "",
      commander: { affiliation:"", name:"", effect:"" },
      cards: [],
      formCard: { color:"", name:"", affiliation:"", status:"", seinenba:"", effect1:"", effect2:"", counterLabel:"", qty:"1" },
      bulkText: ""
    };
  }
  let draft = freshDraft();

  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function uid(){ return Math.random().toString(36).slice(2,10); }
  function nowLabel(){ const d = new Date(); return d.getHours().toString().padStart(2,"0")+":"+d.getMinutes().toString().padStart(2,"0"); }
  function shuffle(arr){
    const a = arr.slice();
    for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }
  function otherSeat(s){ return s === "A" ? "B" : "A"; }
  function fmtMod(n){ return (n >= 0 ? "+" : "") + n; }

  const COLOR_MAP = {
    "赤":"#c0392b", "青":"#2e6da4", "緑":"#3f7d44", "黄":"#c9a227", "黒":"#2b2420",
    "白":"#e8e2d0", "紫":"#6b3fa0", "橙":"#d17a22", "無":"#8a8a8a"
  };
  function colorSwatch(colorText){
    const key = (colorText || "").trim();
    return COLOR_MAP[key] || "#7a7a7a";
  }

  // 場のゾーン定義。メイン①はサブ①・サブ②に、メイン②はサブ②・サブ③に接続。
  // 上段(row1)にメイン、下段(row2)にサブを互い違いに配置することでM字型を表現する。
  const ZONE_DEFS = [
    { key: "sub1",  label: "サブゾーン①",  row: 2, col: 1 },
    { key: "main1", label: "メインゾーン①", row: 1, col: 2 },
    { key: "sub2",  label: "サブゾーン②",  row: 2, col: 3 },
    { key: "main2", label: "メインゾーン②", row: 1, col: 4 },
    { key: "sub3",  label: "サブゾーン③",  row: 2, col: 5 }
  ];
  const ZONE_KEYS = ZONE_DEFS.map(z => z.key);
  const ZONE_LABEL = {}; ZONE_DEFS.forEach(z => { ZONE_LABEL[z.key] = z.label; });
  function emptyField(){ const f = {}; ZONE_KEYS.forEach(k => f[k] = null); return f; }
  function findFieldZone(field, cardId){
    for(const k of ZONE_KEYS){ if(field[k] && field[k].id === cardId) return k; }
    return null;
  }

  // ---------------- Firebase data helpers ----------------
  async function fbGet(path){
    try{
      const snap = await get(ref(db, path));
      return snap.exists() ? snap.val() : null;
    } catch(e){ console.error("fbGet failed", path, e); return null; }
  }
  async function fbSet(path, value){
    try{ await set(ref(db, path), value); }
    catch(e){ console.error("fbSet failed", path, e); }
  }
  async function fbRemove(path){
    try{ await remove(ref(db, path)); }
    catch(e){ console.error("fbRemove failed", path, e); }
  }

  // ---------------- preset deck storage (shared, under /decks) ----------------
  async function loadPresetIndex(){
    const val = await fbGet("decks");
    if(!val) return [];
    return Object.keys(val).map(id => ({
      id, name: val[id].name || "(無題)", cardCount: (val[id].cards||[]).length, updatedAt: val[id].updatedAt || 0
    }));
  }
  async function loadPresetById(id){
    const val = await fbGet("decks/" + id);
    if(!val) return null;
    return { id, ...val };
  }
  async function savePresetById(id, obj){ await fbSet("decks/" + id, obj); }
  async function deletePresetById(id){ await fbRemove("decks/" + id); }

  // ---------------- room seat storage (realtime) ----------------
  function defaultSeatState(){
    return { commander:null, deck:[], hand:[], field:emptyField(), discard:[], submitted:false, started:false, turnState:"normal", log:[], updatedAt:0 };
  }
  // Firebase Realtime Databaseは空配列/null/未設定の項目をそのまま保存できず、
  // 読み込み時にキーごと消えることがあるため、読み込んだデータは必ずこれで補完する。
  function normalizeSeat(raw){
    if(!raw) return null;
    const rawField = raw.field || {};
    const field = emptyField();
    ZONE_KEYS.forEach(k => { field[k] = rawField[k] || null; });
    return {
      commander: raw.commander || null,
      deck: raw.deck || [],
      hand: raw.hand || [],
      field: field,
      discard: raw.discard || [],
      submitted: !!raw.submitted,
      started: !!raw.started,
      turnState: raw.turnState || "normal",
      log: raw.log || [],
      updatedAt: raw.updatedAt || 0
    };
  }
  async function saveSeat(seat, obj){
    obj.updatedAt = Date.now();
    await fbSet(`rooms/${roomCode}/${seat}`, obj);
  }
  function attachRoomListeners(){
    detachRoomListeners();
    unsubA = onValue(ref(db, `rooms/${roomCode}/A`), (snap) => {
      state.A = normalizeSeat(snap.exists() ? snap.val() : null);
      connStatus.A = true;
      render();
    }, (err) => { console.error(err); connStatus.A = false; render(); });
    unsubB = onValue(ref(db, `rooms/${roomCode}/B`), (snap) => {
      state.B = normalizeSeat(snap.exists() ? snap.val() : null);
      connStatus.B = true;
      render();
    }, (err) => { console.error(err); connStatus.B = false; render(); });
  }
  function detachRoomListeners(){
    if(unsubA){ unsubA(); unsubA = null; }
    if(unsubB){ unsubB(); unsubB = null; }
    connStatus = { A:false, B:false };
  }
  function addLog(seatObj, text){
    seatObj.log = seatObj.log || [];
    seatObj.log.push({ ts: nowLabel(), text });
    if(seatObj.log.length > 60) seatObj.log = seatObj.log.slice(-60);
  }

  // ---------------- deck builder helpers ----------------
  function cardSignature(c){
    return [c.color,c.name,c.affiliation,c.status,c.seinenba,c.effect1,c.effect2,c.counterLabel||""].join("\u0001");
  }
  function addDraftCard(){
    const f = draft.formCard;
    if(!f.name.trim()){ errorMsg = "カード名を入力してください。"; render(); return; }
    const statusNum = parseInt(f.status, 10);
    const seinenbaNum = parseInt(f.seinenba, 10);
    let qty = parseInt(f.qty, 10);
    if(isNaN(qty) || qty < 1) qty = 1;
    for(let i=0;i<qty;i++){
      draft.cards.push({
        id: uid(), color: f.color.trim(), name: f.name.trim(), affiliation: f.affiliation.trim(),
        status: isNaN(statusNum) ? 0 : statusNum, seinenba: isNaN(seinenbaNum) ? 0 : seinenbaNum,
        effect1: f.effect1.trim(), effect2: f.effect2.trim(), counterLabel: f.counterLabel.trim()
      });
    }
    draft.formCard = { color:f.color, name:"", affiliation:f.affiliation, status:"", seinenba:"", effect1:"", effect2:"", counterLabel:f.counterLabel, qty:"1" };

  }
  function removeDraftCardGroup(signature){ draft.cards = draft.cards.filter(c => cardSignature(c) !== signature); render(); }
  function cardsToBulkText(){
    return draft.cards.map(c => [c.color,c.name,c.affiliation,c.status,c.seinenba,c.effect1,c.effect2,c.counterLabel||""].join("|")).join("\n");
  }
  function parseBulkText(text){
    const lines = text.split("\n").map(l=>l.trim()).filter(Boolean);
    const out = [];
    lines.forEach(line => {
      const parts = line.split("|").map(p => p.trim());
      const [color="", name="", affiliation="", status="", seinenba="", effect1="", effect2="", counterLabel="", qtyStr=""] = parts;
      let qty = parseInt(qtyStr, 10);
      if(isNaN(qty) || qty < 1) qty = 1;
      for(let i=0;i<qty;i++){
        out.push({ id: uid(), color, name, affiliation, status: parseInt(status,10) || 0, seinenba: parseInt(seinenba,10) || 0, effect1, effect2, counterLabel });
      }
    });
    return out;
  }

    const id = editingPresetId || uid();
    const obj = {
      name: draft.deckName.trim(),
      commander: { affiliation: draft.commander.affiliation.trim(), name: draft.commander.name.trim(), effect: draft.commander.effect.trim() },
      cards: draft.cards, updatedAt: Date.now()
    };
    await savePresetById(id, obj);
    errorMsg = "";
    if(presetEditorReturnTo === "deckSetup"){

    const preset = selectedPresetDetail || await loadPresetById(selectedPresetId);
    if(!preset){ errorMsg = "デッキの読み込みに失敗しました。"; render(); return; }
    const s = defaultSeatState();
    s.commander = { affiliation: preset.commander.affiliation, name: preset.commander.name, effect: preset.commander.effect };

  async function drawCard(){
    const s = state[mySeat];

    const card = s.deck.shift();
    s.hand.push(card);
    addLog(s, "山札から1枚ドローした");
    await saveSeat(mySeat, s); render();
  }

  }
  function openSearch(){ modal = { type:"search" }; render(); }
  async function pickFromSearch(cardId){
    const s = state[mySeat];
    const idx = s.deck.findIndex(c => c.id === cardId);
    if(idx === -1) return;
    const [card] = s.deck.splice(idx, 1);
    s.hand.push(card);
    s.deck = shuffle(s.deck);

  function openChooseZone(cardId){ modal = { type:"chooseZone", cardId }; render(); }
  async function adjustCounter(cardId, delta){
    const s = state[mySeat];
    const card = s.hand.find(c => c.id === cardId) || Object.values(s.field).find(c => c && c.id === cardId) || s.discard.find(c => c.id === cardId);
    if(!card) return;
    card.counter = Math.max(0, (card.counter || 0) + delta);
    await saveSeat(mySeat, s); render();
  }

  async function playToZone(cardId, zoneKey){
    const s = state[mySeat];
    if(s.field[zoneKey]) return; // そのゾーンは既に埋まっている
    const idx = s.hand.findIndex(c => c.id === cardId);
    if(idx === -1) return;
    const [card] = s.hand.splice(idx, 1);
    s.field[zoneKey] = card;
    addLog(s, `『${card.name}』を${ZONE_LABEL[zoneKey]}に出した`);
    modal = null;
    await saveSeat(mySeat, s); render();
  }
  async function discardFromHand(cardId){

    const [card] = s.hand.splice(idx, 1);

    addLog(s, `『${card.name}』を手札から捨てた`);
    modal = null;
    await saveSeat(mySeat, s); render();

    document.getElementById("backBtn").onclick = backFromPresetEditor;
    document.getElementById("saveBtn").onclick = savePresetDraft;
    document.getElementById("tabForm").onclick = switchToForm;
    document.getElementById("tabBulk").onclick = switchToBulk;

    if(deckTab === "form"){
      bindFormInputs([
        ["fColor","color"],["fStatus","status"],["fSeinenba","seinenba"],
        ["fAffiliation","affiliation"],["fName","name"],["fEffect1","effect1"],["fEffect2","effect2"],
        ["fCounterLabel","counterLabel"],["fQty","qty"]
      ], draft.formCard);
      document.getElementById("addCardBtn").onclick = addDraftCard;
      document.querySelectorAll(".del").forEach(el => { el.onclick = () => removeDraftCardGroup(decodeURIComponent(el.getAttribute("data-sig"))); });
    } else {
      const ta = document.getElementById("bulkInput");
      ta.oninput = () => { draft.bulkText = ta.value; };
    }
  }

  function renderDeckSetup(){
    const rows = deckSetupPresets.map(p => `
      <div class="preset-row ${selectedPresetId===p.id ? 'active':''}" data-select="${p.id}">
        <div><div class="pname">${escapeHtml(p.name)}</div><div class="pmeta">${p.cardCount}枚</div></div>
      </div>
    `).join("");

    let previewHtml = "";
    if(selectedPresetId && selectedPresetDetail){
      const d = selectedPresetDetail;
      previewHtml = `
        <div class="preview-box">
          <div style="font-weight:700; margin-bottom:6px;">指揮官: ${escapeHtml(d.commander.name)} <span style="opacity:0.6; font-weight:400;">(${escapeHtml(d.commander.affiliation||"—")})</span></div>
          ${d.commander.effect ? `<div class="hint" style="margin-bottom:10px;">${escapeHtml(d.commander.effect)}</div>` : ""}
          <div style="font-size:12px; opacity:0.6; margin-bottom:4px;">デッキ内容(${d.cards.length}枚)</div>
          ${d.cards.map(c => `
            <div class="preview-cardline">
              <span class="swatch" style="background:${colorSwatch(c.color)};"></span>
              <span style="flex:1;">${escapeHtml(c.name)} <span style="opacity:0.5;">/ ${escapeHtml(c.affiliation||"—")}</span></span>
              <span class="mono" style="opacity:0.7;">${c.status}(${fmtMod(c.seinenba)})</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    app.innerHTML = `
      ${stubHtml()}
      <div class="panel">
        <h3 class="display" style="margin-top:0;">デッキを選択</h3>
        ${deckSetupPresets.length === 0 ? `
          <div class="empty-note">登録済みのデッキがありません。先にデッキを作成してください。</div>
          <button class="small-add full" id="createFromHereBtn" style="margin-top:14px;">＋ ここから新しいデッキを作成する</button>
        ` : `
          ${rows}
          <div class="row" style="margin-top:6px;"><button class="linklike" id="createFromHereBtn">＋ 新しいデッキを作成する</button></div>
        `}
        ${previewHtml}
        ${errorMsg ? `<div class="hint" style="color:#e2a08a; margin-top:12px;">${escapeHtml(errorMsg)}</div>` : ""}
        <div class="row between" style="margin-top:20px;">
          <button class="ghost" id="backBtn">戻る</button>
          <button class="primary" id="submitBtn" ${!selectedPresetId ? "disabled" : ""}>このデッキで登録する</button>
        </div>
      </div>
    `;
    document.getElementById("backBtn").onclick = leaveRoom;
    document.getElementById("submitBtn").onclick = submitSelectedPreset;
    const cfb = document.getElementById("createFromHereBtn");
    if(cfb) cfb.onclick = () => openPresetEditor(null, "deckSetup");
    document.querySelectorAll("[data-select]").forEach(el => { el.onclick = () => selectPreset(el.getAttribute("data-select")); });
  }

  function renderWaiting(){
    const mine = state[mySeat];
    const opp = state[otherSeat(mySeat)];
    const mySub = !!(mine && mine.submitted);
    const oppSub = !!(opp && opp.submitted);
    app.innerHTML = `
      ${stubHtml()}
      <div class="panel">
        <h3 class="display" style="margin-top:0;">対戦準備</h3>
        <div class="status-line"><span class="pip ${mySub?'ready':''}"></span> あなた(席${mySeat}) — ${mySub ? `デッキ登録済み(本隊${mine.deck.length}枚)` : "未登録"}</div>
        <div class="status-line"><span class="pip ${oppSub?'ready':''}"></span> 相手(席${otherSeat(mySeat)}) — ${oppSub ? `デッキ登録済み(本隊${opp.deck.length}枚)` : "待機中..."}</div>
        <div class="row" style="margin-top:16px; flex-wrap:wrap;">
          <button class="ghost" id="backBtn2">戻る</button>
          <button class="ghost" id="redoBtn">デッキを選び直す</button>
          <button class="primary" id="startBtn" ${!mySub ? "disabled" : ""}>ゲーム開始(自分のデッキをシャッフル)</button>
        </div>
        <div class="hint">相手がまだ準備中でも、自分は先に開始できます。相手の画面はリアルタイムで自動更新されます。</div>
      </div>
    `;
    document.getElementById("backBtn2").onclick = leaveRoom;
    document.getElementById("redoBtn").onclick = redoDeckSelection;
    document.getElementById("startBtn").onclick = startGame;
  }

  function statusHtml(card, seat){
    const s = state[seat];
    const active = s && s.turnState === "seinenba";
    const val = active ? (card.status + card.seinenba) : card.status;
    return `<span class="status ${active?'sein':''}">${val}</span> <span style="opacity:0.5; font-size:10px;">(通常${card.status} / 正念場${fmtMod(card.seinenba)})</span>`;
  }
  function cardHtml(card, onclickName, seat, editableCounter){
    const counterRow = card.counterLabel ? `
      <div class="counter-row" onclick="event.stopPropagation();">
        <span>${escapeHtml(card.counterLabel)}: ${card.counter||0}</span>
        ${editableCounter ? `
          <button onclick="event.stopPropagation(); adjustCounter('${card.id}',-1)">−</button>
          <button onclick="event.stopPropagation(); adjustCounter('${card.id}',1)">＋</button>
        ` : ""}
      </div>
    ` : "";
    return `
      <div class="card" onclick="${onclickName}('${card.id}')">
        <div class="toprow"><span class="swatch" style="background:${colorSwatch(card.color)};"></span>${statusHtml(card, seat)}</div>
        <div class="cname">${escapeHtml(card.name)}</div>
        <div class="caff">${escapeHtml(card.affiliation || "")}</div>
        ${card.effect1 ? `<div class="ceffect">①${escapeHtml(card.effect1)}</div>` : ""}
        ${card.effect2 ? `<div class="ceffect">②${escapeHtml(card.effect2)}</div>` : ""}
        ${counterRow}
      </div>
    `;
  }
  function cardBackHtml(seatLetter){ return `<div class="card back ${seatLetter}"></div>`; }
  function commanderHtml(cmd, seat){
    if(!cmd) return `<div class="empty-note">未設定</div>`;
    return `<div class="commander-card" onclick="openCommanderView('${seat}')"><span class="ctag">指揮官</span><span class="cname">${escapeHtml(cmd.name)}</span><span class="caff">${escapeHtml(cmd.affiliation || "")}</span></div>`;
  }
  function zoneBoardHtml(fieldObj, seat, editable){
    return `
      <div class="zone-board-wrap">
        <div class="zone-board">
          ${ZONE_DEFS.map(z => {
            const card = fieldObj[z.key];
            const inner = card
              ? cardHtml(card, editable ? "openFieldCardMenu" : "noop", seat, editable)
              : `<div class="zone-empty">空き</div>`;
            return `
              <div class="zone-slot" style="grid-column:${z.col}; grid-row:${z.row};">
                <div class="zone-slot-label">${z.label}</div>
                ${inner}
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  }

  function renderGame(){
    const mySeatKey = mySeat;
    const oppSeatKey = mySeat ? otherSeat(mySeat) : null;
    const mine = mySeatKey ? state[mySeatKey] : null;
    const opp = oppSeatKey ? state[oppSeatKey] : null;
    if(!roomCode || !mySeatKey || !mine){
      app.innerHTML = `
        <h1 class="title display">卓 -Table-</h1>
        <div class="panel">
          <div class="hint">対戦データが見つかりません。相手がゲームを終了したか、通信状況の問題かもしれません。</div>
          <button class="primary full" id="backHomeBtn" style="margin-top:14px;">ホームに戻る</button>
        </div>
      `;
      const btn = document.getElementById("backHomeBtn");
      if(btn) btn.onclick = leaveRoom;
      return;
    }

    const bothStarted = mine.started && opp && opp.started;
    const oppHandBacks = opp ? opp.hand.map(()=>cardBackHtml(oppSeatKey)).join("") : "";
    const myHandCards = mine.hand.map(c => cardHtml(c, "openHandCardMenu", mySeatKey, true)).join("");

    let mergedLog = [];
    if(mine.log) mergedLog = mergedLog.concat(mine.log.map(e => ({...e, who: mySeatKey})));
    if(opp && opp.log) mergedLog = mergedLog.concat(opp.log.map(e => ({...e, who: oppSeatKey})));
    mergedLog.sort((a,b) => (a.ts > b.ts ? 1 : -1));
    mergedLog = mergedLog.slice(-30);
    const logHtml = mergedLog.map(e => `<div class="log-entry"><span class="mono" style="opacity:0.6;">[${e.ts}]</span> <b style="color:${e.who==='A'?'var(--seat-a)':'var(--seat-b)'}">席${e.who}</b> ${escapeHtml(e.text)}</div>`).join("") || `<div class="empty-note">まだ操作がありません</div>`;

    app.innerHTML = `
      <div class="board">
        <div class="topbar">
          ${stubHtml()}
          <div class="row" style="align-items:center;">
            <span class="conn-badge ${connStatus[oppSeatKey] ? 'ok':'bad'}">${connStatus[oppSeatKey] ? '相手と接続中' : '相手の応答待ち'}</span>
            <button class="ghost" id="leaveBtn">退室</button>
            <button class="ghost" id="endGameBtn" style="color:#e2a08a;">ゲーム終了</button>
          </div>
        </div>

        <div class="zone">
          <div class="zone-label"><span>相手(席${oppSeatKey})の指揮官</span></div>
          <div class="cards-row" style="min-height:auto;">${bothStarted ? commanderHtml(opp.commander, oppSeatKey) : `<div class="empty-note">対戦開始後に表示されます</div>`}</div>
        </div>
        <div class="zone">
          <div class="zone-label"><span>相手(席${oppSeatKey})の手札 ${opp ? `— ${opp.hand.length}枚` : ""}</span></div>
          <div class="cards-row">${oppHandBacks || `<div class="empty-note">なし</div>`}</div>
        </div>
        <div class="zone">
          <div class="zone-label"><span>相手(席${oppSeatKey})の場</span><span class="mono" style="opacity:0.6; cursor:pointer;" id="oppDiscardBtn">捨て札を見る(${opp ? opp.discard.length : 0})</span></div>
          ${opp ? zoneBoardHtml(opp.field, oppSeatKey, false) : `<div class="empty-note">なし</div>`}
        </div>

        <div style="text-align:center; margin: 10px 0; opacity:0.4; font-size:12px; letter-spacing:0.1em;">— — —</div>

        <div class="zone mine"><div class="zone-label"><span>あなた(席${mySeatKey})の指揮官</span></div><div class="cards-row" style="min-height:auto;">${commanderHtml(mine.commander, mySeatKey)}</div></div>
        <div class="zone mine"><div class="zone-label"><span>あなた(席${mySeatKey})の場</span></div>${zoneBoardHtml(mine.field, mySeatKey, true)}</div>
        <div class="zone mine"><div class="zone-label"><span>あなた(席${mySeatKey})の手札 — ${mine.hand.length}枚</span></div><div class="cards-row">${myHandCards || `<div class="empty-note">手札はありません</div>`}</div></div>

        <div class="zone mine">
          <div class="row between" style="flex-wrap:wrap; gap:14px; margin-bottom:12px;">
            <div class="deckbox"><div><div class="num mono">${mine.deck.length}</div><div class="lbl">山札</div></div></div>
            <div class="actions">
              <button class="act" id="drawBtn" ${mine.deck.length===0?"disabled":""}>ドロー</button>
              <button class="act" id="searchBtn" ${mine.deck.length===0?"disabled":""}>サーチ</button>
              <button class="act" id="shuffleBtn" ${mine.deck.length===0?"disabled":""}>シャッフル</button>
              <button class="act" id="myDiscardBtn">捨て札(${mine.discard.length})</button>
            </div>
          </div>
          <div class="row between" style="flex-wrap:wrap; gap:14px;">
            <div class="hint" style="margin:0;">正念場状態: <b style="color:${mine.turnState==='seinenba'?'var(--danger)':'inherit'};">${mine.turnState==='seinenba' ? "発生中" : "通常"}</b></div>
            <div class="actions">
              <button class="act" id="rollBtn">ターン開始抽選(1/3)</button>
              <button class="act ${mine.turnState==='seinenba'?'toggled':''}" id="toggleBtn">手動切替</button>
            </div>
          </div>
        </div>

        <div class="log-panel">${logHtml}</div>
      </div>
      ${!bothStarted ? `<div class="waiting-overlay"><div class="box"><div style="margin-bottom:8px;">相手(席${oppSeatKey})の準備を待っています…</div><div class="hint">相手がゲーム開始ボタンを押すと自動で対戦が始まります。</div></div></div>` : ""}
      ${modalHtml(mine, opp, mySeatKey, oppSeatKey)}
    `;

    document.getElementById("leaveBtn").onclick = leaveRoom;
    document.getElementById("endGameBtn").onclick = confirmEndGame;
    document.getElementById("drawBtn").onclick = drawCard;
    document.getElementById("searchBtn").onclick = openSearch;
    document.getElementById("shuffleBtn").onclick = manualShuffle;
    document.getElementById("myDiscardBtn").onclick = () => openDiscardPeek(mySeatKey);
    document.getElementById("oppDiscardBtn").onclick = () => openDiscardPeek(oppSeatKey);
    document.getElementById("rollBtn").onclick = rollTurnStart;
    document.getElementById("toggleBtn").onclick = toggleTurnState;

    window.openHandCardMenu = openHandCardMenu;
    window.openFieldCardMenu = openFieldCardMenu;
    window.openCommanderView = openCommanderView;
    window.adjustCounter = adjustCounter;
    window.noop = function(){};
  }

  function cardDetailBlock(card, seat, editableCounter){
    return `
      <div class="modal-detail-row"><b>${escapeHtml(card.name)}</b> ${card.affiliation ? `／ ${escapeHtml(card.affiliation)}` : ""}</div>
      <div class="modal-detail-row">属性: ${escapeHtml(card.color || "—")} ／ ${statusHtml(card, seat)}</div>
      ${card.effect1 ? `<div class="modal-detail-row">①${escapeHtml(card.effect1)}</div>` : ""}
      ${card.effect2 ? `<div class="modal-detail-row">②${escapeHtml(card.effect2)}</div>` : ""}
      ${card.counterLabel ? `
        <div class="modal-detail-row">
          「${escapeHtml(card.counterLabel)}」カウンター: ${card.counter||0}
          ${editableCounter ? `
            <button class="act" style="padding:4px 10px; margin-left:8px;" onclick="adjustCounter('${card.id}',-1)">−1</button>
            <button class="act" style="padding:4px 10px;" onclick="adjustCounter('${card.id}',1)">＋1</button>
          ` : ""}
        </div>
      ` : ""}
    `;
  }

  function modalHtml(mine, opp, mySeatKey, oppSeatKey){
    if(!modal) return "";
    if(modal.type === "confirmEndGame"){
      return overlayWrap(`
        <h3 class="display">ゲームを終了しますか？</h3>
        <div class="hint">お互いの手札・場・山札などの情報がすべて破棄されます。終了後は同じ部屋番号で新しく対戦を始められます。</div>
        <div class="row" style="margin-top:16px;">
          <button class="ghost" id="modalCancel">キャンセル</button>
          <button class="primary" id="modalConfirmEndGame" style="background:var(--danger); color:#fff;">終了する</button>
        </div>
      `);
    }
    if(modal.type === "search"){
      const cards = mine.deck.map(c => cardHtml(c, "pickFromSearch", mySeatKey, false)).join("");
      return overlayWrap(`
        <h3 class="display">山札からサーチ</h3>
        <div class="hint">選んだ1枚を手札に加え、残りは自動でシャッフルされます。</div>
        <div class="modal-cards">${cards || `<div class="empty-note">山札にカードがありません</div>`}</div>
        <button class="ghost" id="modalCancel">キャンセル</button>
      `);
    }
    if(modal.type === "handCard"){
      const card = mine.hand.find(c => c.id === modal.cardId);
      if(!card){ modal = null; return ""; }
      return overlayWrap(`
        <h3 class="display">カード詳細</h3>${cardDetailBlock(card, mySeatKey, true)}
        <div class="row" style="flex-wrap:wrap; margin-top:14px;">
          <button class="act" id="mPlay">場に出す</button>
          <button class="act" id="mDiscard">捨てる</button>
          <button class="act" id="mReturn">山札の一番上に戻す</button>
        </div>
        <div style="margin-top:14px;"><button class="ghost" id="modalCancel">キャンセル</button></div>
      `);
    }
    if(modal.type === "fieldCard"){
      const zoneKey = findFieldZone(mine.field, modal.cardId);
      const card = zoneKey ? mine.field[zoneKey] : null;
      if(!card){ modal = null; return ""; }
      return overlayWrap(`
        <h3 class="display">カード詳細 <span style="font-size:12px; opacity:0.6; font-weight:400;">(${ZONE_LABEL[zoneKey]})</span></h3>${cardDetailBlock(card, mySeatKey, true)}
        <div class="row" style="flex-wrap:wrap; margin-top:14px;">
          <button class="act" id="mReturnHand">手札に戻す</button>
          <button class="act" id="mDiscardField">捨てる</button>
        </div>
        <div style="margin-top:14px;"><button class="ghost" id="modalCancel">キャンセル</button></div>
      `);
    }
    if(modal.type === "chooseZone"){
      const card = mine.hand.find(c => c.id === modal.cardId);
      if(!card){ modal = null; return ""; }
      return overlayWrap(`
        <h3 class="display">『${escapeHtml(card.name)}』をどこに出しますか？</h3>
        <div class="hint">各ゾーンには1枚までしか置けません。空いているゾーンから選んでください。</div>
        <div class="zone-picker">
          ${ZONE_DEFS.map(z => {
            const occupied = !!mine.field[z.key];
            return `
              <button class="zone-pick-btn" data-zone="${z.key}" ${occupied ? "disabled" : ""}>
                ${z.label}
                ${occupied ? `<span class="zone-pick-sub">使用中: ${escapeHtml(mine.field[z.key].name)}</span>` : `<span class="zone-pick-sub">空き</span>`}
              </button>
            `;
          }).join("")}
        </div>
        <button class="ghost" id="modalCancel">キャンセル</button>
      `);
    }
    if(modal.type === "commander"){
      const target = modal.seat === mySeatKey ? mine : opp;
      const cmd = target ? target.commander : null;
      if(!cmd){ modal = null; return ""; }
      return overlayWrap(`
        <h3 class="display">指揮官: ${escapeHtml(cmd.name)}</h3>
        <div class="modal-detail-row">所属: ${escapeHtml(cmd.affiliation || "—")}</div>
        ${cmd.effect ? `<div class="modal-detail-row">${escapeHtml(cmd.effect)}</div>` : ""}
        <div style="margin-top:14px;"><button class="ghost" id="modalCancel">閉じる</button></div>
      `);
    }
    if(modal.type === "peekDiscard"){
      const target = modal.seat === mySeatKey ? mine : opp;
      const isMine = modal.seat === mySeatKey;
      const cards = target ? target.discard.slice().reverse().map(c => cardHtml(c, isMine ? "pickFromDiscard" : "noop", modal.seat, false)).join("") : "";
      return overlayWrap(`
        <h3 class="display">席${modal.seat}の捨て札</h3>
        ${isMine ? `<div class="hint">クリックしたカードを手札に加えます。</div>` : ""}
        <div class="modal-cards">${cards || `<div class="empty-note">捨て札はありません</div>`}</div>
        <div class="row" style="margin-top:10px;"><button class="ghost" id="modalCancel">閉じる</button></div>
      `);
    }
    return "";
  }

  function overlayWrap(inner){ return `<div class="overlay" id="overlayBg"><div class="modal">${inner}</div></div>`; }

  const origRender = render;
  render = function(){ origRender(); bindGenericModalButtons(); bindGameModalButtons(); };

  function bindGenericModalButtons(){
    const bg = document.getElementById("overlayBg");
    if(!bg) return;
    bg.addEventListener("click", (e) => { if(e.target === bg) cancelModal(); });
    const c = id => document.getElementById(id);
    if(c("modalCancel")) c("modalCancel").onclick = cancelModal;
    if(c("modalConfirmDelete")) c("modalConfirmDelete").onclick = () => doDeletePreset(modal.id);
    if(c("modalConfirmEndGame")) c("modalConfirmEndGame").onclick = () => doEndGame();
  }
  function bindGameModalButtons(){
    const c = id => document.getElementById(id);
    if(!modal) return;
    if(c("mPlay")) c("mPlay").onclick = () => openChooseZone(modal.cardId);
    if(c("mDiscard")) c("mDiscard").onclick = () => discardFromHand(modal.cardId);
    if(c("mReturn")) c("mReturn").onclick = () => returnToDeckTop(modal.cardId);
    if(c("mReturnHand")) c("mReturnHand").onclick = () => returnFieldToHand(modal.cardId);
    if(c("mDiscardField")) c("mDiscardField").onclick = () => discardFromField(modal.cardId);
    document.querySelectorAll("[data-zone]").forEach(el => {
      el.onclick = () => playToZone(modal.cardId, el.getAttribute("data-zone"));
    });
  }

  window.pickFromSearch = pickFromSearch;
  window.pickFromDiscard = pickFromDiscard;
  window.openCommanderView = openCommanderView;
  window.adjustCounter = adjustCounter;
  window.noop = function(){};

  render();
}
</script>
</body>
</html>
